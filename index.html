<!DOCTYPE html>
<html>
<head>

<title>HR System Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb703">
<!-- FONT AWESOME ICONS -->

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:Arial;
}

body{
  margin:0;
  display:flex;
  height:100vh;
  background:url('bg.jpg') no-repeat center center fixed;
  background-size:cover;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* SIDEBAR */

.sidebar{

  width:220px;

  padding:20px;

  display:flex;

  flex-direction:column;

  background: linear-gradient(
    180deg,
    rgba(20,20,40,0.9),
    rgba(60,0,30,0.9)
  );

  backdrop-filter: blur(10px);

  box-shadow:
    0 0 20px rgba(255,0,80,0.4),
    inset 0 0 10px rgba(255,0,80,0.2);

  border-right:1px solid rgba(255,0,80,0.3);
}

.menu{
  list-style:none;
  padding:0;
}

.menu li{

  padding:12px;

  cursor:pointer;

  border-radius:6px;

  margin-bottom:5px;

  transition:0.2s;
}

.menu li:hover{

  background:rgba(255,255,255,0.2);

  box-shadow:0 0 10px rgba(255,0,80,0.5);

  transform:translateX(5px);
}

.menu li i{

    margin-right:10px;

    width:20px;

    text-align:center;
}

.logout{

  margin-top:auto;

  background:#e74c3c;

  padding:12px;

  text-align:center;

  border-radius:6px;

  cursor:pointer;

  font-weight:bold;
}

/* MAIN */

.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

/* TOP */

.top-row{
  display:flex;
  gap:20px;
  margin-top:15px;
  flex-wrap:wrap;
}

.welcome-box{

  flex:2;

  min-width:250px;

  padding:20px;

  border-radius:15px;

  background: rgba(238,32,78,0.2);

  border:1px solid #EE204E;

  box-shadow:0 0 20px #EE204E;
}

.birthday{

  flex:1;

  min-width:250px;

  padding:20px;

  border-radius:15px;

  text-align:center;

  background: rgba(242,0,60,0.2);

  border:1px solid #F2003C;

  box-shadow:0 0 15px #F2003C;
}

/* SEARCH */

.search-box input{

  width:100%;

  padding:12px;

  border-radius:8px;

  border:none;

  margin-top:15px;

  font-size:15px;
}

#searchResult{

  margin-top:10px;
}

.search-item{

  padding:10px;

  background:#222;

  margin-top:5px;

  cursor:pointer;

  border-radius:6px;

  transition:0.2s;
}

.search-item:hover{

  background:#444;
}

/* ANNOUNCEMENT */

.announce{

  margin-top:20px;

  background: rgba(255,215,0,0.15);

  padding:15px;

  border-radius:10px;

  border:1px solid #FFD700;

  box-shadow:0 0 10px #FFD700;
}

.announce input{

  width:100%;

  padding:10px;

  border:none;

  border-radius:6px;

  margin-top:10px;
}

.announce button{

  margin-top:10px;

  padding:10px 15px;

  border:none;

  border-radius:6px;

  background:#2ecc71;

  color:white;

  cursor:pointer;
}

.announce-item{

  margin-top:10px;

  padding:20px;

  border-radius:10px;

  background: rgba(255,215,0,0.25);

  text-align:center;

  position:relative;

  font-size:18px;

  font-weight:bold;

  padding-bottom:45px;

  padding-right:90px;
}

/* ANNOUNCEMENT BUTTONS */

.announce-actions{

  position:absolute;

  bottom:10px;

  right:10px;
}

.announce-actions button{

  display:block;

  margin:4px 0;

  width:70px;

  border:none;

  border-radius:5px;

  padding:4px;

  cursor:pointer;

  font-size:11px;
}

.edit-btn{
  background:#3498db;
  color:white;
}

.delete-btn{
  background:#e74c3c;
  color:white;
}

/* POPUP */

#empPopup{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,0.7);

  justify-content:center;

  align-items:center;

  z-index:999;
}

.popup-box{

  background:rgba(255,255,255,0.1);

  padding:20px;

  border-radius:15px;

  backdrop-filter:blur(10px);

  box-shadow:0 0 20px #00c6ff;

  width:320px;
}

.popup-box button{

  margin-top:15px;

  padding:10px;

  border:none;

  border-radius:6px;

  cursor:pointer;

  width:100%;
}

</style>

<script>

if(localStorage.getItem("loggedIn")!=="true"){

  window.location.href="login.html";
}

</script>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<h3>HR SYSTEM</h3>

<ul class="menu">

<li onclick="goPage('employee.html')">

<i class="fa-solid fa-users"></i>

Employee

</li>

<li onclick="goPage('attendance.html')">

<i class="fa-solid fa-clock"></i>

Attendance

</li>

<li onclick="goPage('payroll.html')">

<i class="fa-solid fa-money-bill"></i>

Payroll

</li>

<li onclick="goPage('payslip.html')">

<i class="fa-solid fa-file-invoice"></i>

Payslip

</li>

<li onclick="goPage('admin-requests.html')">

<i class="fa-solid fa-clipboard-list"></i>

Requests

</li>

<li onclick="goPage('settings.html')">

<i class="fa-solid fa-gear"></i>

Settings

</li>

</ul>

<div class="logout"
onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</div>

</div>

<!-- MAIN -->

<div class="main">

<h2>Dashboard</h2>

<div class="top-row">

<div class="welcome-box">

<h2>Hi, Welcome 👋</h2>

<p>Have a nice day!</p>

</div>

<div class="birthday">

<h3>🎂 Birthday Today</h3>

<div id="bdayList"></div>

</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<input id="searchEmp"

placeholder="Search employee..."

onkeyup="searchEmployee()">

<div id="searchResult"></div>

</div>

<!-- ANNOUNCEMENT -->

<div class="announce">

<h3>📢 Announcements</h3>

<input id="announceInput"

placeholder="Enter announcement...">

<button onclick="addAnnouncement()">

Post

</button>

<div id="announceList"></div>

</div>

</div>

<!-- POPUP -->

<div id="empPopup">

<div class="popup-box">

<h3>Employee Info</h3>

<div id="empDetails"></div>

<button onclick="closeEmp()">

Close

</button>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* PAGE */

window.goPage = function(p){

  window.location.href = p;
}

window.logout = function(){

  localStorage.removeItem("loggedIn");

  window.location.href =
  "login.html";
}

/* EMPLOYEES */

let employees = [];

async function loadEmployees(){

  employees = [];

  const querySnapshot =
  await getDocs(
    collection(db,"employees")
  );

  querySnapshot.forEach((d)=>{

    employees.push(d.data());

  });

  loadBirthday();
}

/* SEARCH */

window.searchEmployee = function(){

  let keyword =
  searchEmp.value.toLowerCase();

  searchResult.innerHTML = "";

  if(!keyword){
    return;
  }

  employees.forEach(e=>{

    let fullname =

    (
      (e.fname || "") +
      " " +
      (e.lname || "")
    )

    .toLowerCase();

    if(fullname.includes(keyword)){

      searchResult.innerHTML += `

      <div

      class="search-item"

      onclick="showEmp(

      '${e.fname || ""}',

      '${e.lname || ""}'

      )"

      >

      ${e.fname || ""}

      ${e.lname || ""}

      </div>

      `;
    }
  });
}

/* SHOW EMPLOYEE */

window.showEmp = function(fname,lname){

  let e = employees.find(x =>

    x.fname === fname &&

    x.lname === lname

  );

  if(!e){
    return;
  }

  empDetails.innerHTML = `

  <p>
  <b>Name:</b>

  ${e.fname || ""}

  ${e.lname || ""}

  </p>

  <p>
  <b>Position:</b>

  ${e.position || "-"}
  </p>

  <p>
  <b>ID:</b>

  ${e.empid || "-"}
  </p>

  <p>
  <b>Birthday:</b>

  ${e.birthdate || "-"}
  </p>

  <p>
  <b>SSS:</b>

  ${e.sss || "-"}
  </p>

  <p>
  <b>PhilHealth:</b>

  ${e.philhealth || "-"}
  </p>

  <p>
  <b>Pag-IBIG:</b>

  ${e.pagibig || "-"}
  </p>

  <p>
  <b>Bank:</b>

  ${e.bank || "-"}
  </p>

  <p>
  <b>Account:</b>

  ${e.account || "-"}
  </p>

  `;

  empPopup.style.display =
  "flex";
}

/* CLOSE POPUP */

window.closeEmp = function(){

  empPopup.style.display =
  "none";
}

/* ANNOUNCEMENTS */

let announcements =

JSON.parse(
localStorage.getItem("announcements")
)

|| [];

window.addAnnouncement = function(){

  if(!announceInput.value){
    return;
  }

  announcements.push({

    text:
    announceInput.value

  });

  localStorage.setItem(

    "announcements",

    JSON.stringify(announcements)

  );

  announceInput.value = "";

  loadAnnouncements();
}

function loadAnnouncements(){

  announceList.innerHTML = "";

  announcements.forEach((a,i)=>{

    announceList.innerHTML += `

    <div class="announce-item">

      ${a.text}

      <div class="announce-actions">

        <button class="edit-btn"

        onclick="editAnnouncement(${i})">

        Edit

        </button>

        <button class="delete-btn"

        onclick="deleteAnnouncement(${i})">

        Delete

        </button>

      </div>

    </div>

    `;
  });
}

window.editAnnouncement = function(i){

  let t = prompt(

    "Edit:",

    announcements[i].text

  );

  if(t){

    announcements[i].text = t;

    localStorage.setItem(

      "announcements",

      JSON.stringify(announcements)

    );

    loadAnnouncements();
  }
}

window.deleteAnnouncement = function(i){

  if(confirm("Delete?")){

    announcements.splice(i,1);

    localStorage.setItem(

      "announcements",

      JSON.stringify(announcements)

    );

    loadAnnouncements();
  }
}

/* BIRTHDAY */

function loadBirthday(){

  let today =
  new Date()

  .toISOString()

  .slice(5,10);

  let b = employees.filter(e =>

    e.birthdate &&

    e.birthdate.slice(5,10) === today

  );

  bdayList.innerHTML =

  b.length

  ?

  b.map(e =>

    e.fname +

    " " +

    e.lname

  )

  .join("<br>")

  :

  "No birthday";
}

/* START */

loadEmployees();

loadAnnouncements();

</script>

</body>
</html>
