<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HR System Login</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(
    135deg,
    #1e0033,
    #3a0066,
    #001f3f
  );

  overflow:hidden;
}

/* CONTAINER */

.container{

  width:850px;

  min-height:500px;

  display:flex;

  border-radius:20px;

  overflow:hidden;

  box-shadow:
  0 0 40px rgba(0,255,255,0.2);

  animation:float 4s ease-in-out infinite;

}

/* FLOAT EFFECT */

@keyframes float{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }

  100%{
    transform:translateY(0);
  }

}

/* LEFT */

.left{

  flex:1;

  position:relative;

  background:
  url('hr-bg.jpg')
  no-repeat center center;

  background-size:cover;

  display:flex;

  justify-content:center;

  align-items:center;

  color:white;

  text-align:center;

  padding:20px;
}

/* OVERLAY */

.left::before{

  content:"";

  position:absolute;

  inset:0;

  background:
  linear-gradient(
    135deg,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.3)
  );
}

/* LEFT CONTENT */

.left-content{

  position:relative;

  z-index:1;
}

/* LOGO */

.logo{

  width:110px;

  height:110px;

  object-fit:contain;

  border-radius:50%;

  background:white;

  padding:8px;

  margin-bottom:15px;

  box-shadow:
  0 0 20px rgba(255,255,255,0.7);
}

/* TEXT */

.left span{

  font-size:30px;

  font-weight:bold;

  line-height:1.5;

  text-shadow:
  0 0 15px rgba(255,255,255,0.8);

}

/* RIGHT */

.right{

  flex:1;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(15px);

  padding:35px;

  color:white;

  display:flex;

  flex-direction:column;

  justify-content:center;
}

/* TITLE */

.right h2{

  text-align:center;

  margin-bottom:25px;

  font-size:32px;
}

/* INPUTS */

input,
select{

  width:100%;

  padding:13px;

  margin-top:12px;

  border:none;

  border-radius:8px;

  background:
  rgba(255,255,255,0.15);

  color:white;

  outline:none;

  font-size:15px;
}

input::placeholder{

  color:#ddd;
}

select option{

  color:black;
}

/* BUTTON */

button{

  width:100%;

  padding:13px;

  margin-top:18px;

  border:none;

  border-radius:8px;

  background:
  linear-gradient(
    45deg,
    #00c6ff,
    #0072ff
  );

  color:white;

  font-weight:bold;

  font-size:16px;

  cursor:pointer;

  transition:0.3s;
}

button:hover{

  transform:scale(1.03);

  box-shadow:
  0 0 15px #00c6ff;
}

/* INFO */

.info{

  margin-top:18px;

  background:
  rgba(255,255,255,0.1);

  padding:12px;

  border-radius:8px;

  font-size:13px;

  line-height:1.6;
}

/* MOBILE */

@media(max-width:850px){

  body{
    padding:15px;
  }

  .container{

    width:100%;

    flex-direction:column;

    min-height:auto;
  }

  .left{

    height:250px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- LEFT -->

  <div class="left">

    <div class="left-content">

      <!-- LOGO -->

      <img src="logo.png"
      class="logo">

      <!-- TITLE -->

      <span>

        PAPPRITO<br>

        HR MANAGEMENT<br>

        SYSTEM

      </span>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="right">

    <h2>

    <i class="fa-solid fa-user-lock"></i>

    LOGIN

    </h2>

    <!-- MODE -->

    <select id="mode">

      <option value="admin">

        Admin Login

      </option>

      <option value="employee">

        Employee Login

      </option>

    </select>

    <!-- USERNAME -->

    <input

    type="text"

    id="username"

    placeholder="Username">

    <!-- PASSWORD -->

    <input

    type="password"

    id="password"

    placeholder="Password">

    <!-- BUTTON -->

    <button onclick="login()">

      <i class="fa-solid fa-right-to-bracket"></i>

      LOGIN

    </button>

    <!-- INFO -->

    <div class="info">

      <b>

      <i class="fa-solid fa-user-shield"></i>

      Default Admin

      </b>

      <br><br>

      Username: admin

      <br>

      Password: 123

    </div>

  </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =====================================
   DEFAULT ADMIN
===================================== */

if(!localStorage.getItem("admin")){

  let admin = {

    username:"admin",

    password:"123"

  };

  localStorage.setItem(
    "admin",
    JSON.stringify(admin)
  );
}

/* =====================================
   LOGIN
===================================== */

window.login = async function(){

  let username =

  document.getElementById(
    "username"
  )

  .value

  .trim()

  .toLowerCase();

  let password =

  document.getElementById(
    "password"
  )

  .value

  .trim();

  let mode =

  document.getElementById(
    "mode"
  )

  .value;

  /* =========================
     ADMIN LOGIN
  ========================= */

  if(mode === "admin"){

    let admin =

    JSON.parse(
      localStorage.getItem("admin")
    );

    if(

      username ===
      admin.username

      &&

      password ===
      admin.password

    ){

      localStorage.setItem(
        "loggedIn",
        "true"
      );

      alert(
        "Admin Login Success"
      );

      window.location.href =
      "index.html";
    }

    else{

      alert(
        "Invalid Admin Login"
      );
    }
  }

  /* =========================
     EMPLOYEE LOGIN
  ========================= */

  if(mode === "employee"){

    /* LOAD FIREBASE USERS */

    const userSnapshot =

    await getDocs(
      collection(db,"users")
    );

    let foundUser = null;

    userSnapshot.forEach((d)=>{

      let u = d.data();

      if(

        (u.username || "")
        .toLowerCase()
        .trim()

        ===

        username

        &&

        (u.password || "")
        .trim()

        ===

        password

      ){

        foundUser = u;
      }
    });

    /* USER NOT FOUND */

    if(!foundUser){

      alert(
        "Invalid Employee Login"
      );

      return;
    }

    /* FIREBASE EMPLOYEE */

    const querySnapshot =

    await getDocs(
      collection(db,"employees")
    );

    let employee = null;

    querySnapshot.forEach((d)=>{

      let e = d.data();

      let fullname =

      (
        (e.fname || "") +
        " " +
        (e.lname || "")
      )

      .toLowerCase()
      .trim();

      let savedName =

      (foundUser.name || "")

      .toLowerCase()
      .trim();

      if(

        fullname === savedName

      ){

        employee = e;
      }
    });

    /* LOGIN SUCCESS */

    if(employee){

      localStorage.setItem(

        "empSession",

        JSON.stringify(employee)

      );

      localStorage.setItem(
        "employeeLoggedIn",
        "true"
      );

      alert(

        "Welcome " +
        employee.fname

      );

      window.location.href =
      "employee-portal.html";
    }

    else{

      alert(
        "Employee record not found"
      );
    }
  }

}

/* =====================================
   ENTER KEY
===================================== */

document.addEventListener(

  "keypress",

  function(e){

    if(e.key === "Enter"){

      login();
    }
  }

);

</script>

</body>
</html>
