<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb703">
<title>PAPPRITO HR Login</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(
    135deg,
    #7a0000,
    #c1121f,
    #ffb703
  );

  overflow:hidden;

  position:relative;
}

/* BACKGROUND CIRCLES */

body::before{

  content:"";

  position:absolute;

  width:500px;
  height:500px;

  border-radius:50%;

  background:
  rgba(255,255,255,0.08);

  top:-150px;
  left:-150px;
}

body::after{

  content:"";

  position:absolute;

  width:400px;
  height:400px;

  border-radius:50%;

  background:
  rgba(255,255,255,0.06);

  bottom:-120px;
  right:-120px;
}

/* CONTAINER */

.container{

  width:950px;

  min-height:580px;

  display:flex;

  border-radius:30px;

  overflow:hidden;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(25px);

  box-shadow:
  0 0 40px rgba(0,0,0,0.35);

  position:relative;

  z-index:10;
}

/* LEFT SIDE */

.left{

  flex:1;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:40px;

  background:
  linear-gradient(
    180deg,
    rgba(255,0,0,0.15),
    rgba(255,193,7,0.08)
  );
}

/* CONTENT */

.left-content{

  text-align:center;
}

/* LOGO */

.logo{

  width:190px;

  height:190px;

  object-fit:cover;

  margin:auto;

  display:block;

  border-radius:50%;

  border:6px solid #ffd60a;

  background:white;

  padding:8px;

  box-shadow:
  0 0 35px rgba(255,214,10,0.9);

  filter:
  drop-shadow(
    0 0 20px rgba(255,255,255,0.6)
  );
}

/* PAPPRITO */

.brand{

  margin-top:25px;

  font-size:52px;

  font-weight:900;

  letter-spacing:4px;

  color:#ffd60a;

  text-shadow:
  0 0 25px rgba(255,214,10,0.8);
}

/* SUBTITLE */

.sub{

  margin-top:12px;

  font-size:19px;

  color:white;

  letter-spacing:2px;

  line-height:1.8;
}

/* RIGHT */

.right{

  flex:1;

  padding:50px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  background:
  rgba(0,0,0,0.25);

  color:white;
}

/* LOGIN TITLE */

.right h2{

  text-align:center;

  margin-bottom:30px;

  font-size:38px;

  color:#ffd60a;

  text-shadow:
  0 0 15px rgba(255,214,10,0.7);
}

/* INPUTS */

input,
select{

  width:100%;

  padding:16px 18px;

  margin-top:16px;

  border-radius:16px;

  border:2px solid rgba(255,255,255,0.15);

  background:
  linear-gradient(
    135deg,
    rgba(255,255,255,0.18),
    rgba(255,255,255,0.08)
  );

  color:white;

  font-size:15px;

  font-weight:500;

  outline:none;

  transition:0.35s ease;

  backdrop-filter:blur(12px);

  box-shadow:
  0 8px 20px rgba(0,0,0,0.15);
}

/* PLACEHOLDER */

input::placeholder{

  color:#ffe8a3;

  letter-spacing:1px;
}

/* SELECT */

select{

  appearance:none;

  cursor:pointer;
}

select option{

  color:black;

  background:white;
}

/* FOCUS */

input:focus,
select:focus{

  border:2px solid #ffd60a;

  background:
  linear-gradient(
    135deg,
    rgba(255,214,10,0.18),
    rgba(255,255,255,0.12)
  );

  transform:translateY(-2px);

  box-shadow:
  0 0 20px rgba(255,214,10,0.5),
  0 10px 25px rgba(0,0,0,0.25);
}

/* HOVER */

input:hover,
select:hover{

  border-color:
  rgba(255,214,10,0.4);
}

/* BUTTON */

button{

  width:100%;

  padding:16px;

  margin-top:24px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(
    45deg,
    #ffbe0b,
    #fb5607
  );

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

  transition:0.35s;
}

/* BUTTON HOVER */

button:hover{

  transform:translateY(-2px);

  box-shadow:
  0 0 25px rgba(255,190,11,0.7);
}

/* MOBILE */

@media(max-width:900px){

  body{
    padding:15px;
  }

  .container{

    width:100%;

    flex-direction:column;
  }

  .left{

    padding:30px;
  }

  .brand{

    font-size:40px;
  }

  .logo{

    width:150px;
    height:150px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- LEFT -->

<div class="left">

<div class="left-content">

<img src="logo.png"
class="logo">

<div class="brand">

PAPPRITO

</div>

<div class="sub">

HR MANAGEMENT SYSTEM

</div>

</div>

</div>

<!-- RIGHT -->

<div class="right">

<h2>

<i class="fa-solid fa-user-lock"></i>

LOGIN

</h2>

<!-- LOGIN MODE -->

<select id="mode">

<option value="admin">

Admin Login

</option>

<option value="employee">

Employee Login

</option>

</select>

<!-- USERNAME -->

<input
type="text"
id="username"
placeholder="Enter Username">

<!-- PASSWORD -->

<input
type="password"
id="password"
placeholder="Enter Password">

<!-- BUTTON -->

<button onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>

LOGIN

</button>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

/* INIT */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* DEFAULT ADMIN */

if(!localStorage.getItem("admin")){

  localStorage.setItem(

    "admin",

    JSON.stringify({

      username:"admin",

      password:"123"

    })

  );
}

/* LOGIN */

window.login = async function(){

  let username =

  document.getElementById(
    "username"
  )

  .value

  .trim()
  .toLowerCase();

  let password =

  document.getElementById(
    "password"
  )

  .value

  .trim();

  let mode =

  document.getElementById(
    "mode"
  )

  .value;

  /* ADMIN LOGIN */

  if(mode === "admin"){

    let admin =

    JSON.parse(
      localStorage.getItem("admin")
    );

    if(

      username ===
      admin.username

      &&

      password ===
      admin.password

    ){

      localStorage.setItem(
        "loggedIn",
        "true"
      );

      alert(
        "Admin Login Success"
      );

      window.location.href =
      "index.html";
    }

    else{

      alert(
        "Invalid Admin Login"
      );
    }
  }

  /* EMPLOYEE LOGIN */

  if(mode === "employee"){

    const userSnapshot =

    await getDocs(
      collection(db,"users")
    );

    let foundUser = null;

    userSnapshot.forEach((d)=>{

      let u = d.data();

      if(

        (u.username || "")
        .toLowerCase()
        .trim()

        ===

        username

        &&

        (u.password || "")
        .trim()

        ===

        password

      ){

        foundUser = u;
      }
    });

    /* INVALID */

    if(!foundUser){

      alert(
        "Invalid Employee Login"
      );

      return;
    }

    /* FIND EMPLOYEE */

    const querySnapshot =

    await getDocs(
      collection(db,"employees")
    );

    let employee = null;

    querySnapshot.forEach((d)=>{

      let e = d.data();

      if(

        (e.empid || "")
        .toString()
        .trim()

        ===

        (foundUser.empid || "")
        .toString()
        .trim()

      ){

        employee = e;
      }
    });

    /* SUCCESS */

    if(employee){

      localStorage.setItem(

        "empSession",

        JSON.stringify(employee)

      );

      localStorage.setItem(
        "employeeLoggedIn",
        "true"
      );

      alert(

        "Welcome " +
        employee.fname

      );

      window.location.href =
      "employee-portal.html";
    }

    else{

      alert(
        "Employee record not found"
      );
    }
  }

}

/* ENTER KEY */

document.addEventListener(

  "keypress",

  function(e){

    if(e.key === "Enter"){

      login();
    }
  }

);

</script>
<script>

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("sw.js")

  .then(()=>{

    console.log(
      "Service Worker Registered"
    );

  });

}

</script>
</body>
</html>
