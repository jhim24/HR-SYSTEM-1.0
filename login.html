<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PAPPRITO HR Login</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  linear-gradient(
    135deg,
    #7a0000,
    #c1121f,
    #ffb703
  );

  overflow:hidden;
}

/* ANIMATION */

body::before{

  content:"";

  position:absolute;

  width:500px;
  height:500px;

  background:
  rgba(255,255,255,0.08);

  border-radius:50%;

  top:-120px;
  left:-120px;
}

body::after{

  content:"";

  position:absolute;

  width:400px;
  height:400px;

  background:
  rgba(255,255,255,0.05);

  border-radius:50%;

  bottom:-100px;
  right:-100px;
}

/* CONTAINER */

.container{

  width:950px;

  min-height:560px;

  display:flex;

  border-radius:25px;

  overflow:hidden;

  background:
  rgba(255,255,255,0.08);

  backdrop-filter:blur(20px);

  box-shadow:
  0 0 40px rgba(0,0,0,0.3);

  position:relative;

  z-index:10;
}

/* LEFT */

.left{

  flex:1;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:40px;

  position:relative;

  background:
  linear-gradient(
    180deg,
    rgba(255,0,0,0.15),
    rgba(255,193,7,0.1)
  );
}

/* LEFT CONTENT */

.left-content{

  text-align:center;
}

/* LOGO */

.logo{

  width:180px;

  height:180px;

  object-fit:contain;

  margin:auto;

  display:block;

  filter:
  drop-shadow(
    0 0 25px rgba(255,255,255,0.6)
  );
}

/* PAPPRITO */

.brand{

  margin-top:20px;

  font-size:48px;

  font-weight:900;

  letter-spacing:3px;

  color:#ffd60a;

  text-shadow:
  0 0 20px rgba(255,214,10,0.8);
}

/* SUB */

.sub{

  margin-top:10px;

  font-size:18px;

  color:white;

  line-height:1.6;
}

/* RIGHT */

.right{

  flex:1;

  padding:50px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  background:
  rgba(0,0,0,0.25);

  color:white;
}

/* TITLE */

.right h2{

  text-align:center;

  margin-bottom:30px;

  font-size:36px;

  color:#ffd60a;

  text-shadow:
  0 0 15px rgba(255,214,10,0.6);
}

/* INPUTS */

input,
select{

  width:100%;

  padding:14px;

  margin-top:14px;

  border:none;

  border-radius:12px;

  background:
  rgba(255,255,255,0.15);

  color:white;

  font-size:15px;

  outline:none;

  backdrop-filter:blur(10px);
}

/* PLACEHOLDER */

input::placeholder{

  color:#f1f1f1;
}

select option{

  color:black;
}

/* BUTTON */

button{

  width:100%;

  padding:14px;

  margin-top:22px;

  border:none;

  border-radius:12px;

  background:
  linear-gradient(
    45deg,
    #ffbe0b,
    #fb5607
  );

  color:white;

  font-size:17px;

  font-weight:bold;

  cursor:pointer;

  transition:0.3s;
}

button:hover{

  transform:translateY(-2px);

  box-shadow:
  0 0 20px rgba(255,190,11,0.7);
}

/* MOBILE */

@media(max-width:900px){

  body{
    padding:15px;
  }

  .container{

    flex-direction:column;

    width:100%;
  }

  .left{

    padding:30px;
  }

  .brand{

    font-size:38px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- LEFT -->

<div class="left">

<div class="left-content">

<img src="logo.png"
class="logo">

<div class="brand">

PAPPRITO

</div>

<div class="sub">

HR MANAGEMENT SYSTEM

</div>

</div>

</div>

<!-- RIGHT -->

<div class="right">

<h2>

<i class="fa-solid fa-user-lock"></i>

LOGIN

</h2>

<!-- MODE -->

<select id="mode">

<option value="admin">

Admin Login

</option>

<option value="employee">

Employee Login

</option>

</select>

<!-- USERNAME -->

<input
type="text"
id="username"
placeholder="Enter Username">

<!-- PASSWORD -->

<input
type="password"
id="password"
placeholder="Enter Password">

<!-- LOGIN -->

<button onclick="login()">

<i class="fa-solid fa-right-to-bracket"></i>

LOGIN

</button>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* ADMIN */

if(!localStorage.getItem("admin")){

  localStorage.setItem(

    "admin",

    JSON.stringify({

      username:"admin",

      password:"123"

    })

  );
}

/* LOGIN */

window.login = async function(){

  let username =

  document.getElementById(
    "username"
  )

  .value

  .trim()
  .toLowerCase();

  let password =

  document.getElementById(
    "password"
  )

  .value

  .trim();

  let mode =

  document.getElementById(
    "mode"
  )

  .value;

  /* ADMIN */

  if(mode === "admin"){

    let admin =

    JSON.parse(
      localStorage.getItem("admin")
    );

    if(

      username ===
      admin.username

      &&

      password ===
      admin.password

    ){

      localStorage.setItem(
        "loggedIn",
        "true"
      );

      alert(
        "Admin Login Success"
      );

      window.location.href =
      "index.html";
    }

    else{

      alert(
        "Invalid Admin Login"
      );
    }
  }

  /* EMPLOYEE */

  if(mode === "employee"){

    const userSnapshot =

    await getDocs(
      collection(db,"users")
    );

    let foundUser = null;

    userSnapshot.forEach((d)=>{

      let u = d.data();

      if(

        (u.username || "")
        .toLowerCase()
        .trim()

        ===

        username

        &&

        (u.password || "")
        .trim()

        ===

        password

      ){

        foundUser = u;
      }
    });

    if(!foundUser){

      alert(
        "Invalid Employee Login"
      );

      return;
    }

    const querySnapshot =

    await getDocs(
      collection(db,"employees")
    );

    let employee = null;

    querySnapshot.forEach((d)=>{

      let e = d.data();

      if(

        (e.empid || "")
        .toString()
        .trim()

        ===

        (foundUser.empid || "")
        .toString()
        .trim()

      ){

        employee = e;
      }
    });

    if(employee){

      localStorage.setItem(

        "empSession",

        JSON.stringify(employee)

      );

      localStorage.setItem(
        "employeeLoggedIn",
        "true"
      );

      alert(

        "Welcome " +
        employee.fname

      );

      window.location.href =
      "employee-portal.html";
    }

    else{

      alert(
        "Employee record not found"
      );
    }
  }

}

/* ENTER KEY */

document.addEventListener(

  "keypress",

  function(e){

    if(e.key === "Enter"){

      login();
    }
  }

);

</script>

</body>
</html>
