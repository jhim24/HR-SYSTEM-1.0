<!DOCTYPE html>
<html>
<head>

<title>Settings - Employee Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb703">
<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  background:linear-gradient(135deg,#1e1e2f,#2a2a40);
  color:white;
  padding:20px;
  min-height:100vh;
}

/* CONTAINER */

.container{
  max-width:950px;
  margin:auto;
}

/* BOX */

.box{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  margin-bottom:20px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

/* BACK BUTTON */

.back-btn{
  background:#00c6ff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  transition:0.2s;
}

.back-btn:hover{
  transform:scale(1.05);
  background:#00a8e8;
}

/* FORM GRID */

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:20px;
}

/* INPUT */

input,select{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:14px;
  background:#f1f1f1;
}

/* BUTTON */

.save-btn{
  margin-top:18px;
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#2ecc71;
  color:white;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.save-btn:hover{
  opacity:0.9;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:850px;
  margin-top:20px;
  border-collapse:collapse;
}

th{
  background:#111827;
  color:white;
}

td,th{
  border:1px solid rgba(255,255,255,0.15);
  padding:10px;
  text-align:center;
  font-size:14px;
}

/* ACTION BUTTONS */

.action-btn{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
  margin:2px;
  font-size:12px;
}

.edit-btn{
  background:#3498db;
}

.delete-btn{
  background:#e74c3c;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:20px;
  opacity:0.7;
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="box header">

<h2>

<i class="fa-solid fa-user-lock"></i>

Employee Login Settings

</h2>

<div class="back-btn"
onclick="goBack()">

<i class="fa-solid fa-arrow-left"></i>

Back

</div>

</div>

<!-- FORM -->

<div class="box">

<div class="form-grid">

<select id="empSelect"></select>

<input id="username"
placeholder="Username">

<input id="password"
type="password"
placeholder="Password">

</div>

<button class="save-btn"
onclick="saveUser()">

<i class="fa-solid fa-floppy-disk"></i>

Save User

</button>

</div>

<!-- TABLE -->

<div class="box">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Employee ID</th>

<th>Employee Name</th>

<th>Username</th>

<th>Password</th>

<th>Action</th>

</tr>

</thead>

<tbody id="userTable"></tbody>

</table>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =====================================
   EMPLOYEES
===================================== */

let employees = [];

async function loadEmployees(){

  employees = [];

  empSelect.innerHTML = "";

  const querySnapshot =

  await getDocs(
    collection(db,"employees")
  );

  querySnapshot.forEach((d)=>{

    let e = d.data();

    employees.push(e);

    empSelect.innerHTML += `

    <option>

    ${(e.fname || "")}
    ${(e.lname || "")}

    </option>

    `;
  });
}

/* =====================================
   USERS
===================================== */

let users = [];

let editIndex = -1;

/* LOAD USERS */

async function loadUsers(){

  users = [];

  userTable.innerHTML = "";

  const querySnapshot =

  await getDocs(
    collection(db,"users")
  );

  if(querySnapshot.empty){

    userTable.innerHTML = `

    <tr>

      <td colspan="5"
      class="empty">

      No users found

      </td>

    </tr>

    `;

    return;
  }

  querySnapshot.forEach((d)=>{

    let u = d.data();

    u.docId = d.id;

    users.push(u);
  });

  renderUsers();
}

/* =====================================
   RENDER USERS
===================================== */

function renderUsers(){

  userTable.innerHTML = "";

  users.forEach((u,i)=>{

    userTable.innerHTML += `

    <tr>

      <td>

      ${u.empid || "-"}

      </td>

      <td>

      ${u.name || "-"}

      </td>

      <td>

      ${u.username || "-"}

      </td>

      <td>

      ${u.password || "-"}

      </td>

      <td>

        <button

        class="action-btn edit-btn"

        onclick="editUser(${i})">

        <i class="fa-solid fa-pen"></i>

        Edit

        </button>

        <button

        class="action-btn delete-btn"

        onclick="deleteUser('${u.docId}')">

        <i class="fa-solid fa-trash"></i>

        Delete

        </button>

      </td>

    </tr>

    `;
  });
}

/* =====================================
   SAVE USER
===================================== */

window.saveUser = async function(){

  if(

    !empSelect.value ||

    !username.value ||

    !password.value

  ){

    alert("Fill all fields");

    return;
  }

  /* GET SELECTED EMPLOYEE */

  let selectedEmployee = employees.find(e =>

      (
        (e.fname || "") +
        " " +
        (e.lname || "")
      )

      .trim()

      ===

      empSelect.value.trim()

  );

  /* EMPLOYEE ID */

  let selectedEmpId =

  selectedEmployee

  ? selectedEmployee.empid

  : "";

  /* USER OBJECT */

  let user = {

      name:
      empSelect.value
      .trim(),

      empid:
      selectedEmpId,

      username:
      username.value
      .trim()
      .toLowerCase(),

      password:
      password.value
      .trim()

  };

  /* UPDATE */

  if(editIndex > -1){

    let oldUser =
    users[editIndex];

    await updateDoc(

      doc(
        db,
        "users",
        oldUser.docId
      ),

      user

    );

    editIndex = -1;

    alert("User Updated");
  }

  /* ADD */

  else{

    await addDoc(

      collection(db,"users"),

      user

    );

    alert("User Saved");
  }

  clearForm();

  loadUsers();
}

/* =====================================
   EDIT
===================================== */

window.editUser = function(i){

  let u = users[i];

  empSelect.value = u.name;

  username.value = u.username;

  password.value = u.password;

  editIndex = i;

  window.scrollTo({

    top:0,

    behavior:'smooth'

  });
}

/* =====================================
   DELETE
===================================== */

window.deleteUser = async function(id){

  let confirmDelete =

  confirm(
    "Delete this user?"
  );

  if(!confirmDelete){
    return;
  }

  await deleteDoc(

    doc(db,"users",id)

  );

  loadUsers();
}

/* =====================================
   CLEAR FORM
===================================== */

function clearForm(){

  username.value = "";

  password.value = "";

  editIndex = -1;
}

/* =====================================
   BACK
===================================== */

window.goBack = function(){

  window.location.href =
  "index.html";
}

/* =====================================
   START
===================================== */

loadEmployees();

loadUsers();

</script>

</body>
</html>
