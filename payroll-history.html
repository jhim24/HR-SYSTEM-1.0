<!DOCTYPE html>
<html>
<head>

<title>Payroll History</title>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  background:
  linear-gradient(
    135deg,
    #eef2ff,
    #f8fafc
  );
  padding:20px;
  color:#1e293b;
}

/* HEADER */

.header{
  max-width:1400px;
  margin:auto;
  margin-bottom:20px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

/* TITLE */

.title-box h2{
  margin:0;
}

.title-box p{
  margin:5px 0 0;
  color:#64748b;
}

/* BUTTONS */

.top-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:600;
  transition:0.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.back{
  background:#64748b;
}

.clear{
  background:#ef4444;
}

.export{
  background:#0ea5e9;
}

/* FILTER */

.filters{
  max-width:1400px;
  margin:auto;
  margin-bottom:20px;

  background:white;
  padding:18px;
  border-radius:16px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.06);

  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:12px;
}

/* INPUT */

input,
select{

  padding:12px;

  border-radius:10px;

  border:1px solid #dbeafe;

  outline:none;

  font-size:14px;
}

input:focus,
select:focus{

  border-color:#2563eb;

  box-shadow:
  0 0 0 4px rgba(37,99,235,0.1);
}

/* STATS */

.stats{

  max-width:1400px;

  margin:auto;

  margin-bottom:20px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:15px;
}

.stat-card{

  background:white;

  border-radius:18px;

  padding:20px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.06);

  position:relative;

  overflow:hidden;
}

.stat-card::before{

  content:"";

  position:absolute;

  right:-30px;
  top:-30px;

  width:100px;
  height:100px;

  background:
  rgba(37,99,235,0.08);

  border-radius:50%;
}

.stat-title{

  color:#64748b;

  font-size:13px;
}

.stat-value{

  font-size:28px;

  font-weight:bold;

  margin-top:8px;
}

/* TABLE CARD */

.card{

  max-width:1400px;

  margin:auto;

  background:white;

  border-radius:18px;

  padding:18px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.06);

  overflow:auto;
}

/* TABLE */

table{

  width:100%;

  min-width:1200px;

  border-collapse:collapse;
}

th{

  background:#2563eb;

  color:white;

  padding:12px;

  font-size:13px;
}

td{

  padding:10px;

  border-bottom:1px solid #e5e7eb;

  text-align:center;

  font-size:13px;
}

/* ROW HOVER */

tbody tr:hover{

  background:#f8fafc;
}

/* ACTION BUTTONS */

.action-btn{

  border:none;

  padding:7px 12px;

  border-radius:8px;

  cursor:pointer;

  color:white;

  margin:2px;

  font-size:12px;
}

.view{
  background:#2563eb;
}

.edit{
  background:#f59e0b;
}

.delete{
  background:#ef4444;
}

.print{
  background:#10b981;
}

/* DETAILS */

#detailsBox{
  display:none;
  margin-top:20px;
}

/* BADGE */

.badge{

  background:#dcfce7;

  color:#166534;

  padding:5px 10px;

  border-radius:20px;

  font-size:11px;

  font-weight:bold;
}

/* EMPTY */

.empty{

  text-align:center;

  padding:30px;

  color:#64748b;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="header">

<div class="title-box">

<h2>

<i class="fa-solid fa-clock-rotate-left"></i>

Payroll History

</h2>

<p>

Firebase Connected Payroll Monitoring

</p>

</div>

<div class="top-actions">

<button class="btn back"
onclick="goBack()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>

<button class="btn clear"
onclick="clearAll()">

<i class="fa-solid fa-trash"></i>

Clear All

</button>

<button class="btn export"
onclick="window.print()">

<i class="fa-solid fa-print"></i>

Print

</button>

</div>

</div>

<!-- FILTERS -->

<div class="filters">

<input
type="text"
id="search"
placeholder="Search Employee Name..."
onkeyup="loadHistory()">

<input
type="date"
id="dateFilter"
onchange="loadHistory()">

<select
id="salaryFilter"
onchange="loadHistory()">

<option value="">

All Salary

</option>

<option value="high">

High Salary

</option>

<option value="low">

Low Salary

</option>

</select>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat-card">

<div class="stat-title">

Total Payroll Records

</div>

<div class="stat-value"
id="totalRecords">

0

</div>

</div>

<div class="stat-card">

<div class="stat-title">

Total Payroll Amount

</div>

<div class="stat-value"
id="totalPayroll">

₱0

</div>

</div>

<div class="stat-card">

<div class="stat-title">

Highest Net Pay

</div>

<div class="stat-value"
id="highestNet">

₱0

</div>

</div>

</div>

<!-- TABLE -->

<div class="card">

<table>

<thead>

<tr>

<th>Employee ID</th>

<th>Name</th>

<th>Date</th>

<th>Gross</th>

<th>Deductions</th>

<th>Net Pay</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

<!-- DETAILS -->

<div class="card"
id="detailsBox">

<h3>

<i class="fa-solid fa-receipt"></i>

Payroll Details

</h3>

<br>

<button
class="action-btn print"
onclick="printDetails()">

<i class="fa-solid fa-print"></i>

Print Payslip

</button>

<br><br>

<table>

<thead>

<tr>

<th>Employee</th>

<th>Rate</th>

<th>Days</th>

<th>OT</th>

<th>Holiday</th>

<th>SSS</th>

<th>Pag-IBIG</th>

<th>PhilHealth</th>

<th>Loan</th>

<th>Total Deduction</th>

<th>Net</th>

</tr>

</thead>

<tbody id="detailsTable"></tbody>

</table>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =====================================
   DATA
===================================== */

let payrollData = [];

let currentData = null;

/* =====================================
   LOAD HISTORY
===================================== */

window.loadHistory = async function(){

  payrollData = [];

  historyTable.innerHTML = "";

  const querySnapshot =

  await getDocs(
    collection(db,"payroll")
  );

  querySnapshot.forEach((d)=>{

    let row = d.data();

    row.docId = d.id;

    payrollData.push(row);
  });

  /* FILTERS */

  let search =

  document.getElementById(
    "search"
  )

  .value

  .toLowerCase();

  let date =

  document.getElementById(
    "dateFilter"
  )

  .value;

  let salaryFilter =

  document.getElementById(
    "salaryFilter"
  )

  .value;

  let totalNet = 0;

  let highestNet = 0;

  let totalRecords = 0;

  payrollData.forEach((p)=>{

    let matchName =

    (p.name || "")
    .toLowerCase()
    .includes(search);

    let matchDate =

    !date ||

    (
      (p.date || "")
      .includes(date)
    );

    let matchSalary = true;

    if(salaryFilter === "high"){

      matchSalary =
      Number(p.net || 0) >= 50000;
    }

    if(salaryFilter === "low"){

      matchSalary =
      Number(p.net || 0) < 50000;
    }

    if(

      matchName &&
      matchDate &&
      matchSalary

    ){

      totalRecords++;

      totalNet +=
      Number(p.net || 0);

      if(
        Number(p.net || 0)
        > highestNet
      ){

        highestNet =
        Number(p.net || 0);
      }

      let totalDed =

      Number(p.sss || 0)+
      Number(p.pagibig || 0)+
      Number(p.philhealth || 0)+
      Number(p.loan || 0);

      historyTable.innerHTML += `

      <tr>

        <td>

        ${p.empid || "-"}

        </td>

        <td>

        ${p.name || "-"}

        </td>

        <td>

        ${p.date || "-"}

        </td>

        <td>

        ₱ ${Number(p.gross || 0)
        .toLocaleString()}

        </td>

        <td>

        ₱ ${totalDed
        .toLocaleString()}

        </td>

        <td>

        ₱ ${Number(p.net || 0)
        .toLocaleString()}

        </td>

        <td>

        <span class="badge">

        PAID

        </span>

        </td>

        <td>

          <button
          class="action-btn view"
          onclick="viewRecord('${p.docId}')">

          View

          </button>

          <button
          class="action-btn edit"
          onclick="editRecord('${p.docId}')">

          Edit

          </button>

          <button
          class="action-btn delete"
          onclick="deleteRecord('${p.docId}')">

          Delete

          </button>

        </td>

      </tr>

      `;
    }

  });

  /* EMPTY */

  if(totalRecords === 0){

    historyTable.innerHTML = `

    <tr>

      <td colspan="8"
      class="empty">

      No payroll records found

      </td>

    </tr>

    `;
  }

  /* STATS */

  totalPayroll.innerText =

  "₱" +

  totalNet.toLocaleString();

  highestNet.innerText =

  "₱" +

  highestNet.toLocaleString();

  totalRecords.innerText =
  totalRecords;
}

/* =====================================
   VIEW
===================================== */

window.viewRecord = function(id){

  let p = payrollData.find(x =>

    x.docId === id
  );

  if(!p){
    return;
  }

  currentData = p;

  detailsBox.style.display =
  "block";

  let totalDed =

  Number(p.sss || 0)+
  Number(p.pagibig || 0)+
  Number(p.philhealth || 0)+
  Number(p.loan || 0);

  detailsTable.innerHTML = `

  <tr>

    <td>

    ${p.name || "-"}

    </td>

    <td>

    ${p.rate || 0}

    </td>

    <td>

    ${p.days || 0}

    </td>

    <td>

    ${p.ot || 0}

    </td>

    <td>

    ${p.holiday || 0}

    </td>

    <td>

    ${p.sss || 0}

    </td>

    <td>

    ${p.pagibig || 0}

    </td>

    <td>

    ${p.philhealth || 0}

    </td>

    <td>

    ${p.loan || 0}

    </td>

    <td>

    ${totalDed}

    </td>

    <td>

    ${p.net || 0}

    </td>

  </tr>

  `;

  window.scrollTo({

    top:
    document.body.scrollHeight,

    behavior:'smooth'

  });
}

/* =====================================
   PRINT
===================================== */

window.printDetails = function(){

  if(!currentData){

    alert("No payroll selected");

    return;
  }

  let p = currentData;

  let printWindow =

  window.open(
    "",
    "_blank"
  );

  printWindow.document.write(`

  <html>

  <head>

  <title>Payslip</title>

  <style>

  body{

    font-family:Arial;

    padding:30px;
  }

  .box{

    border:2px solid #333;

    padding:20px;
  }

  h2{

    text-align:center;
  }

  table{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;
  }

  td,th{

    border:1px solid #ddd;

    padding:10px;
  }

  </style>

  </head>

  <body>

  <div class="box">

  <h2>Payslip</h2>

  <p>

  <b>Name:</b>

  ${p.name}

  </p>

  <p>

  <b>Employee ID:</b>

  ${p.empid}

  </p>

  <p>

  <b>Date:</b>

  ${p.date || "-"}

  </p>

  <table>

  <tr>

  <th>Description</th>

  <th>Amount</th>

  </tr>

  <tr>

  <td>Gross Salary</td>

  <td>${p.gross}</td>

  </tr>

  <tr>

  <td>SSS</td>

  <td>${p.sss}</td>

  </tr>

  <tr>

  <td>Pag-IBIG</td>

  <td>${p.pagibig}</td>

  </tr>

  <tr>

  <td>PhilHealth</td>

  <td>${p.philhealth}</td>

  </tr>

  <tr>

  <td>Loan</td>

  <td>${p.loan}</td>

  </tr>

  <tr>

  <th>NET PAY</th>

  <th>${p.net}</th>

  </tr>

  </table>

  </div>

  </body>

  </html>

  `);

  printWindow.document.close();

  printWindow.print();
}

/* =====================================
   DELETE
===================================== */

window.deleteRecord = async function(id){

  let confirmDelete =

  confirm(
    "Delete payroll?"
  );

  if(!confirmDelete){
    return;
  }

  await deleteDoc(

    doc(db,"payroll",id)

  );

  loadHistory();
}

/* =====================================
   CLEAR
===================================== */

window.clearAll = async function(){

  let confirmDelete =

  confirm(
    "Delete ALL payroll?"
  );

  if(!confirmDelete){
    return;
  }

  const querySnapshot =

  await getDocs(
    collection(db,"payroll")
  );

  for(const d of querySnapshot.docs){

    await deleteDoc(
      doc(db,"payroll",d.id)
    );
  }

  loadHistory();
}

/* =====================================
   EDIT
===================================== */

window.editRecord = function(id){

  localStorage.setItem(
    "editPayrollId",
    id
  );

  window.location.href =
  "payroll.html";
}

/* =====================================
   BACK
===================================== */

window.goBack = function(){

  window.location.href =
  "index.html";
}

/* START */

loadHistory();

</script>

</body>
</html>
