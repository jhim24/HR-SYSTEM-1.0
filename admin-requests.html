<!DOCTYPE html>
<html>
<head>

<title>Admin Requests</title>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  min-height:100vh;

  background:
  linear-gradient(
    135deg,
    #7b0000,
    #c1121f,
    #ffb703
  );

  padding:20px;

  color:white;
}

/* CONTAINER */

.container{
  max-width:1300px;
  margin:auto;
}

/* BOX */

.box{
  background:
  rgba(255,255,255,0.1);

  backdrop-filter:blur(15px);

  padding:20px;

  border-radius:20px;

  margin-bottom:20px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.3);
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

/* TITLE */

.title{
  display:flex;
  align-items:center;
  gap:12px;
}

/* BADGE */

.notify{
  background:#ff1744;

  padding:6px 12px;

  border-radius:30px;

  font-size:12px;

  font-weight:bold;

  animation:pulse 1s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.08);
  }

  100%{
    transform:scale(1);
  }

}

/* BACK */

.back{
  background:#00c6ff;

  padding:10px 16px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  transition:0.3s;
}

.back:hover{
  transform:scale(1.05);
}

/* FILTER */

.filters{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:12px;
}

/* INPUT */

input,
select{

  width:100%;

  padding:12px;

  border:none;

  border-radius:12px;

  outline:none;

  font-size:14px;
}

/* STATS */

.stats{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(220px,1fr));

  gap:15px;

  margin-bottom:20px;
}

.card{
  background:
  rgba(255,255,255,0.1);

  backdrop-filter:blur(15px);

  padding:20px;

  border-radius:20px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.3);
}

.card h3{
  margin:0;
  font-size:15px;
}

.card .value{
  margin-top:10px;
  font-size:32px;
  font-weight:bold;
}

/* TABLE */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  min-width:1100px;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:12px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.15);
}

th{
  background:
  rgba(0,0,0,0.4);
}

/* STATUS */

.pending{
  color:yellow;
  font-weight:bold;
}

.approved{
  color:#00ffcc;
  font-weight:bold;
}

.rejected{
  color:#ff6b6b;
  font-weight:bold;
}

/* BUTTON */

.btn{
  border:none;

  padding:8px 12px;

  border-radius:10px;

  color:white;

  cursor:pointer;

  margin:2px;

  transition:0.3s;
}

.btn:hover{
  transform:scale(1.05);
}

.approve{
  background:#00c853;
}

.reject{
  background:#ff1744;
}

.delete{
  background:#455a64;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:30px;
  opacity:0.8;
}

/* MOBILE */

@media(max-width:768px){

  body{
    padding:12px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="box header">

<div class="title">

<h2>

<i class="fa-solid fa-clipboard-list"></i>

Admin Request Panel

</h2>

<div class="notify"
id="notifyBadge">

0 Pending

</div>

</div>

<div class="back"
onclick="goBack()">

<i class="fa-solid fa-arrow-left"></i>

Back

</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="card">

<h3>

<i class="fa-solid fa-paper-plane"></i>

Total Requests

</h3>

<div class="value"
id="totalRequests">

0

</div>

</div>

<div class="card">

<h3>

<i class="fa-solid fa-clock"></i>

Pending

</h3>

<div class="value"
id="pendingCount">

0

</div>

</div>

<div class="card">

<h3>

<i class="fa-solid fa-check"></i>

Approved

</h3>

<div class="value"
id="approvedCount">

0

</div>

</div>

<div class="card">

<h3>

<i class="fa-solid fa-xmark"></i>

Rejected

</h3>

<div class="value"
id="rejectedCount">

0

</div>

</div>

</div>

<!-- FILTER -->

<div class="box">

<div class="filters">

<input
type="text"
id="search"
placeholder="Search Employee..."
onkeyup="loadRequests()">

<select
id="statusFilter"
onchange="loadRequests()">

<option value="">

All Status

</option>

<option value="Pending">

Pending

</option>

<option value="Approved">

Approved

</option>

<option value="Rejected">

Rejected

</option>

</select>

</div>

</div>

<!-- TABLE -->

<div class="box">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>Employee ID</th>

<th>Name</th>

<th>Request Type</th>

<th>Date</th>

<th>Reason</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="reqTable"></tbody>

</table>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
updateDoc,
deleteDoc,
doc,
onSnapshot

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =====================================
   VARIABLES
===================================== */

let allRequests = [];

let initialized = false;

/* =====================================
   LOAD REQUESTS
===================================== */

window.loadRequests = async function(){

  reqTable.innerHTML = "";

  allRequests = [];

  const querySnapshot =

  await getDocs(
    collection(db,"requests")
  );

  /* REMOVE DUPLICATES */

  const uniqueMap = new Map();

  querySnapshot.forEach((d)=>{

    let r = d.data();

    r.docId = d.id;

    uniqueMap.set(
      d.id,
      r
    );
  });

  allRequests =

  Array.from(
    uniqueMap.values()
  );

  /* FILTERS */

  let search =

  document.getElementById(
    "search"
  )

  .value

  .toLowerCase();

  let statusFilter =

  document.getElementById(
    "statusFilter"
  )

  .value;

  /* COUNTS */

  let pending = 0;
  let approved = 0;
  let rejected = 0;

  /* EMPTY */

  if(allRequests.length === 0){

    reqTable.innerHTML = `

    <tr>

      <td colspan="7"
      class="empty">

      No requests found

      </td>

    </tr>

    `;
  }

  /* LOOP */

  allRequests.forEach((r)=>{

    if(r.status === "Pending"){
      pending++;
    }

    if(r.status === "Approved"){
      approved++;
    }

    if(r.status === "Rejected"){
      rejected++;
    }

    let matchSearch =

    (r.name || "")
    .toLowerCase()
    .includes(search);

    let matchStatus =

    !statusFilter ||

    r.status === statusFilter;

    if(

      matchSearch &&
      matchStatus

    ){

      let statusClass =

      (r.status || "Pending")
      .toLowerCase();

      reqTable.innerHTML += `

      <tr>

        <td>

        ${r.empid || "-"}

        </td>

        <td>

        ${r.name || "-"}

        </td>

        <td>

        ${r.type || "-"}

        </td>

        <td>

        ${r.date || "-"}

        </td>

        <td>

        ${r.reason || "-"}

        </td>

        <td class="${statusClass}">

        ${r.status || "Pending"}

        </td>

        <td>

          <button

          class="btn approve"

          onclick="updateStatus(

          '${r.docId}',

          'Approved'

          )">

          <i class="fa-solid fa-check"></i>

          Approve

          </button>

          <button

          class="btn reject"

          onclick="updateStatus(

          '${r.docId}',

          'Rejected'

          )">

          <i class="fa-solid fa-xmark"></i>

          Reject

          </button>

          <button

          class="btn delete"

          onclick="deleteRequest(

          '${r.docId}'

          )">

          <i class="fa-solid fa-trash"></i>

          Delete

          </button>

        </td>

      </tr>

      `;
    }

  });

  /* STATS */

  totalRequests.innerText =
  allRequests.length;

  pendingCount.innerText =
  pending;

  approvedCount.innerText =
  approved;

  rejectedCount.innerText =
  rejected;

  notifyBadge.innerText =
  pending + " Pending";
}

/* =====================================
   REALTIME LISTENER
===================================== */

onSnapshot(

  collection(db,"requests"),

  (snapshot)=>{

    if(initialized){

      if(snapshot.docChanges().length > 0){

        snapshot.docChanges().forEach((change)=>{

          if(change.type === "added"){

            alert(
              "🔔 New Employee Request"
            );
          }

        });
      }
    }

    initialized = true;

    loadRequests();
  }

);

/* =====================================
   UPDATE STATUS
===================================== */

window.updateStatus = async function(

  id,
  status

){

  await updateDoc(

    doc(db,"requests",id),

    {

      status:status

    }

  );

  alert(
    "Request Updated"
  );

  loadRequests();
}

/* =====================================
   DELETE
===================================== */

window.deleteRequest = async function(id){

  let confirmDelete =

  confirm(
    "Delete this request?"
  );

  if(!confirmDelete){
    return;
  }

  await deleteDoc(

    doc(db,"requests",id)

  );

  alert(
    "Request Deleted"
  );

  loadRequests();
}

/* =====================================
   BACK
===================================== */

window.goBack = function(){

  window.location.href =
  "index.html";
}

/* START */

loadRequests();

</script>

</body>
</html>
