<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Papprito Employee Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),
    url('bg.jpg');

    background-size:cover;
    background-position:center;
}

/* LOGIN BOX */

.box{

    width:400px;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,0,0,0.4);

}

/* HEADER */

.top{

    background:#d71920;

    color:white;

    text-align:center;

    padding:30px 20px;

}

.top img{

    width:90px;

    margin-bottom:10px;

}

.top h2{

    font-size:34px;

    font-weight:900;

}

.top p{

    margin-top:5px;

    opacity:0.9;

}

/* FORM */

.form{

    padding:30px;

}

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:6px;

    font-weight:bold;

    color:#444;

}

.input-group input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:16px;

    transition:0.3s;

}

.input-group input:focus{

    border-color:#d71920;

    outline:none;

    box-shadow:0 0 5px rgba(215,25,32,0.4);

}

/* BUTTON */

.loginBtn{

    width:100%;

    padding:14px;

    background:#d71920;

    color:white;

    border:none;

    border-radius:6px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

.loginBtn:hover{

    background:#b81418;

}

/* EMPLOYEE INFO */

.info{

    margin-top:20px;

    background:#f4f4f4;

    padding:15px;

    border-radius:8px;

    display:none;

}

.info p{

    margin:5px 0;

    color:#333;

    font-size:15px;

}

/* FOOTER */

.footer{

    text-align:center;

    padding:15px;

    color:#777;

    font-size:13px;

}

</style>
</head>

<body>

<div class="box">

    <!-- TOP -->

    <div class="top">

        <!-- CHANGE LOGO -->
        <img src="logo.png">

        <h2>PAPPRITO</h2>

        <p>Employee Attendance Portal</p>

    </div>

    <!-- FORM -->

    <div class="form">

        <!-- EMPLOYEE ID -->

        <div class="input-group">

            <label>Employee ID</label>

            <input type="text"
            id="id"
            placeholder="Enter Employee ID">

        </div>

        <!-- EMPLOYEE NAME -->

        <div class="input-group">

            <label>Employee Name</label>

            <input type="text"
            id="name"
            placeholder="Employee Name"
            readonly>

        </div>

        <!-- EMPLOYEE DETAILS -->

        <div class="info" id="infoBox">

            <p>
                <b>Department:</b>
                <span id="dept"></span>
            </p>

            <p>
                <b>Position:</b>
                <span id="position"></span>
            </p>

            <p>
                <b>Status:</b>
                <span id="status"></span>
            </p>

        </div>

        <!-- BUTTON -->

        <button class="loginBtn"
        onclick="login()">

            LOGIN

        </button>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        Papprito HR Management System

    </div>

</div>

<script>

/* SAMPLE EMPLOYEES */

if(!localStorage.getItem("employees")){

    let sampleEmployees = [

        {
            id:"PP80050",
            fname:"Rusty",
            lname:"DEGAMHON",
            department:"Kitchen",
            position:"Cook",
            status:"Active"
        },

        {
            id:"PP80134",
            fname:"Joemarie",
            lname:"MACALALAD",
            department:"Cashier",
            position:"Supervisor",
            status:"Active"
        }

    ];

    localStorage.setItem(
        "employees",
        JSON.stringify(sampleEmployees)
    );

}

/* AUTO SEARCH EMPLOYEE */

document.getElementById("id")
.addEventListener("keyup", function(){

    let empId = this.value.trim();

    let employees =
    JSON.parse(localStorage.getItem("employees"))
    || [];

    let found =
    employees.find(e =>
        (e.id || e.empId) === empId
    );

    if(found){

        /* NAME */

        document.getElementById("name").value =

        found.fname + " " + found.lname;

        /* DETAILS */

        document.getElementById("dept").innerText =

        found.department || "N/A";

        document.getElementById("position").innerText =

        found.position || "N/A";

        document.getElementById("status").innerText =

        found.status || "Active";

        /* SHOW INFO */

        document.getElementById("infoBox")
        .style.display="block";

    }else{

        document.getElementById("name").value="";

        document.getElementById("dept").innerText="";

        document.getElementById("position").innerText="";

        document.getElementById("status").innerText="";

        document.getElementById("infoBox")
        .style.display="none";

    }

});

/* LOGIN */

function login(){

    let empId =
    document.getElementById("id")
    .value
    .trim();

    let employees =
    JSON.parse(localStorage.getItem("employees"))
    || [];

    let found =
    employees.find(e =>
        (e.id || e.empId) === empId
    );

    if(found){

        localStorage.setItem(
            "empSession",
            JSON.stringify(found)
        );

        alert(
            "Welcome " +
            found.fname + "!"
        );

        window.location.href =
        "employee-portal.html";

    }else{

        alert("Employee not found");

    }

}

/* ENTER KEY */

document.addEventListener("keypress",
function(e){

    if(e.key==="Enter"){

        login();

    }

});

</script>

</body>
</html>
