<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Papprito Attendance System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#e5e5e5;
    padding:15px;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* HEADER */

.top{
    background:#d71920;
    color:white;
    text-align:center;
    padding:20px;
}

.title{
    font-size:35px;
    font-weight:900;
}

/* DROPDOWN */

.select-box{
    margin-top:15px;
}

select{
    width:320px;
    padding:10px;
    border:none;
    border-radius:5px;
    font-size:16px;
}

/* EMPLOYEE INFO */

.emp-box{
    margin-top:15px;
    line-height:1.8;
    font-size:16px;
    font-weight:bold;
}

/* CLOCK */

.clock{
    margin-top:10px;
    font-size:30px;
    font-weight:bold;
}

.today{
    font-size:16px;
    margin-top:5px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

.btn{
    width:170px;
    padding:12px;
    border:none;
    border-radius:5px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.timein{
    background:#12b347;
}

.timeout{
    background:#ff0000;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
}

th{
    background:yellow;
    border:1px solid #555;
    padding:10px;
    font-size:15px;
}

td{
    border:1px solid #777;
    padding:8px;
    text-align:center;
    font-size:14px;
}

.late{
    color:red;
    font-weight:bold;
}

.ontime{
    color:green;
    font-weight:bold;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:4px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

    <div class="top">

        <div class="title">

            EMPLOYEE ATTENDANCE

        </div>

        <!-- DROPDOWN -->

        <div class="select-box">

            <select id="employeeSelect"
            onchange="changeEmployee()">

            </select>

        </div>

        <!-- EMPLOYEE INFO -->

        <div class="emp-box">

            <div id="empid"></div>

            <div id="empname"></div>

        </div>

        <!-- CLOCK -->

        <div class="clock"
        id="clock"></div>

        <div class="today"
        id="today"></div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button class="btn timein"
            onclick="timeIn()">

                TIME IN

            </button>

            <button class="btn timeout"
            onclick="timeOut()">

                TIME OUT

            </button>

        </div>

    </div>

    <!-- TABLE -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>DATE</th>
                    <th>EMP ID</th>
                    <th>EMPLOYEE NAME</th>
                    <th>TIME IN</th>
                    <th>BREAK</th>
                    <th>TIME OUT</th>
                    <th>TOTAL HOURS</th>
                    <th>LATE</th>
                    <th>STATUS</th>
                    <th>ACTION</th>

                </tr>

            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

getDocs,

addDoc,

deleteDoc,

doc,

updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

/* INIT */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* VARIABLES */

let employees = [];

let attendance = [];

let currentEmployee = null;

/* =========================================
   LOAD EMPLOYEES
========================================= */

async function loadEmployees(){

    employees = [];

    const querySnapshot =
    await getDocs(
        collection(db,"employees")
    );

    let select =
    document.getElementById(
        "employeeSelect"
    );

    select.innerHTML = "";

    querySnapshot.forEach((d,index)=>{

        let e = d.data();

        employees.push(e);

        select.innerHTML += `

        <option value="${index}">

            ${e.empid} -
            ${e.lname},
            ${e.fname}

        </option>

        `;
    });

    if(employees.length > 0){

        currentEmployee =
        employees[0];

        loadEmployeeInfo();

        loadAttendance();
    }
}

/* =========================================
   CHANGE EMPLOYEE
========================================= */

window.changeEmployee = function(){

    let index =
    document.getElementById(
        "employeeSelect"
    ).value;

    currentEmployee =
    employees[index];

    loadEmployeeInfo();

    render();
}

/* =========================================
   EMPLOYEE INFO
========================================= */

function loadEmployeeInfo(){

    if(!currentEmployee){
        return;
    }

    document.getElementById("empid")
    .innerHTML =

    "EMPLOYEE ID : " +

    (currentEmployee.empid || "-");

    document.getElementById("empname")
    .innerHTML =

    "EMPLOYEE NAME : " +

    currentEmployee.lname +

    ", " +

    currentEmployee.fname;
}

/* =========================================
   CLOCK
========================================= */

function updateClock(){

    let now = new Date();

    document.getElementById("clock")
    .innerHTML =

    now.toLocaleTimeString();

    document.getElementById("today")
    .innerHTML =

    now.toDateString();
}

setInterval(updateClock,1000);

updateClock();

/* =========================================
   LOAD ATTENDANCE
========================================= */

async function loadAttendance(){

    attendance = [];

    const querySnapshot =
    await getDocs(
        collection(db,"attendance")
    );

    querySnapshot.forEach((d)=>{

        let row = d.data();

        row.docId = d.id;

        attendance.push(row);
    });

    render();
}

/* =========================================
   TIME IN
========================================= */

window.timeIn = async function(){

    if(!currentEmployee){
        alert("No Employee Found");
        return;
    }

    let now = new Date();

    let date =
    now.toLocaleDateString();

    let existing =
    attendance.find(r =>

        r.empid ===
        currentEmployee.empid

        &&

        r.date === date

        &&

        !r.timeout

    );

    if(existing){

        alert("Already TIME IN");

        return;
    }

    let lateMinutes = 0;

    let status = "ON TIME";

    let totalMinutes =

    now.getHours() * 60 +

    now.getMinutes();

    let officeTime = 8 * 60;

    if(totalMinutes > officeTime){

        lateMinutes =

        totalMinutes - officeTime;

        status = "LATE";
    }

    await addDoc(

        collection(db,"attendance"),

        {

            date:date,

            empid:
            currentEmployee.empid,

            name:

            currentEmployee.lname +

            ", " +

            currentEmployee.fname,

            timein:
            now.toLocaleTimeString(),

            breaktime:0,

            timeout:"",

            total:"0",

            late:
            lateMinutes + " mins",

            status:status

        }

    );

    await loadAttendance();

    alert("TIME IN SUCCESS");
}

/* =========================================
   TIME OUT
========================================= */

window.timeOut = async function(){

    if(!currentEmployee){
        return;
    }

    let row =
    attendance.find(r =>

        r.empid ===
        currentEmployee.empid

        &&

        !r.timeout

    );

    if(!row){

        alert("No active TIME IN");

        return;
    }

    let now = new Date();

    let breakMinutes =
    prompt(
        "Enter Break Time in Minutes",
        "60"
    );

    breakMinutes =
    parseInt(breakMinutes) || 0;

    let start =
    new Date(
        row.date + " " + row.timein
    );

    let end =
    new Date();

    let hrs =
    (end-start)/1000/60/60;

    hrs =
    hrs - (breakMinutes/60);

    if(hrs < 0){
        hrs = 0;
    }

    await updateDoc(

        doc(db,"attendance",row.docId),

        {

            timeout:
            now.toLocaleTimeString(),

            breaktime:
            breakMinutes,

            total:
            hrs.toFixed(2)

        }

    );

    await loadAttendance();

    alert("TIME OUT SUCCESS");
}

/* =========================================
   DELETE
========================================= */

window.deleteRow =
async function(id){

    let confirmDelete =
    confirm(
        "Delete attendance?"
    );

    if(!confirmDelete){
        return;
    }

    await deleteDoc(
        doc(db,"attendance",id)
    );

    loadAttendance();
}

/* =========================================
   RENDER
========================================= */

function render(){

    let tbody =
    document.getElementById(
        "tbody"
    );

    tbody.innerHTML = "";

    attendance

    .filter(r =>

        currentEmployee &&

        r.empid ===
        currentEmployee.empid

    )

    .reverse()

    .forEach(r => {

        tbody.innerHTML += `

        <tr>

            <td>
            ${r.date || '-'}
            </td>

            <td>
            ${r.empid || '-'}
            </td>

            <td>
            ${r.name || '-'}
            </td>

            <td>
            ${r.timein || '-'}
            </td>

            <td>
            ${r.breaktime || 0} mins
            </td>

            <td>
            ${r.timeout || '-'}
            </td>

            <td>
            ${r.total || 0}
            </td>

            <td class="late">

            ${r.late || '0 mins'}

            </td>

            <td class="
            ${r.status === 'LATE'
            ? 'late'
            : 'ontime'}
            ">

            ${r.status || 'ON TIME'}

            </td>

            <td>

                <button
                class="delete-btn"

                onclick="deleteRow('${r.docId}')">

                DELETE

                </button>

            </td>

        </tr>

        `;
    });
}

/* START */

loadEmployees();

</script>

</body>
</html>
