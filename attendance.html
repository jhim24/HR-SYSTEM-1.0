<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Papprito Attendance System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#e5e5e5;
}

/* CONTAINER */

.container{
    width:1100px;
    margin:20px auto;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

/* HEADER */

.top{
    background:#d71920;
    color:white;
    text-align:center;
    padding:40px 20px 60px;
}

.logo{
    width:100px;
    margin-bottom:10px;
}

.title{
    font-size:60px;
    font-weight:900;
}

/* EMPLOYEE INFO */

.emp-box{
    margin-top:25px;
    line-height:1.8;
    font-size:22px;
    font-weight:bold;
}

/* CLOCK */

.clock{
    margin-top:20px;
    font-size:35px;
    font-weight:bold;
}

.today{
    font-size:22px;
    margin-top:5px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:120px;
    margin-top:40px;
}

.btn{
    width:220px;
    padding:18px;
    border:none;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    border:3px solid white;
}

.btn:hover{
    transform:scale(1.05);
}

.timein{
    background:#12b347;
}

.timeout{
    background:#ff0000;
}

/* TABLE */

.table-box{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:yellow;
    border:1px solid #555;
    padding:12px;
    font-size:20px;
}

td{
    border:1px solid #777;
    padding:10px;
    text-align:center;
    font-size:18px;
}

.late{
    color:red;
    font-weight:bold;
}

.ontime{
    color:green;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="top">

        <!-- LOGO -->
        <!-- Replace with your own logo -->
        <img src="logo.png" class="logo">

        <div class="title">
            EMPLOYEE ATTENDANCE
        </div>

        <!-- EMPLOYEE INFO -->
        <div class="emp-box">

            <div id="empid"></div>

            <div id="empname"></div>

        </div>

        <!-- CLOCK -->
        <div class="clock" id="clock"></div>

        <div class="today" id="today"></div>

        <!-- BUTTONS -->
        <div class="buttons">

            <button class="btn timein"
            onclick="timeIn()">

                TIME IN

            </button>

            <button class="btn timeout"
            onclick="timeOut()">

                TIME OUT

            </button>

        </div>

    </div>

    <!-- TABLE -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>DATE</th>

                    <th>EMP ID</th>

                    <th>EMP NAME</th>

                    <th>TIME IN</th>

                    <th>BREAK</th>

                    <th>TIME OUT</th>

                    <th>TOTAL HOURS</th>

                    <th>LATE</th>

                    <th>STATUS</th>

                </tr>

            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

</div>

<script>

/* =========================================
   SAMPLE EMPLOYEE MASTER LIST
========================================= */

if(!localStorage.getItem("employees")){

    let sampleEmployees = [

        {
            empid:"PP80050",
            fname:"Rusty",
            lname:"DEGAMHON",
            password:"1234"
        },

        {
            empid:"PP80134",
            fname:"Joemarie",
            lname:"MACALALAD",
            password:"1234"
        }

    ];

    localStorage.setItem(
        "employees",
        JSON.stringify(sampleEmployees)
    );
}

/* =========================================
   AUTO LOGIN DEMO
========================================= */

if(!localStorage.getItem("loggedEmployee")){

    let employees =
    JSON.parse(localStorage.getItem("employees"));

    localStorage.setItem(
        "loggedEmployee",
        JSON.stringify(employees[0])
    );
}

/* =========================================
   LOAD EMPLOYEE
========================================= */

let emp =
JSON.parse(localStorage.getItem("loggedEmployee"));

document.getElementById("empid").innerHTML =
"EMPLOYEE ID : " + emp.empid;

document.getElementById("empname").innerHTML =
"EMPLOYEE NAME : " +
emp.lname + ", " + emp.fname;

/* =========================================
   LIVE CLOCK
========================================= */

function updateClock(){

    let now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString();

    document.getElementById("today").innerHTML =
    now.toDateString();
}

setInterval(updateClock,1000);

updateClock();

/* =========================================
   TIME IN
========================================= */

function timeIn(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let now = new Date();

    let date =
    now.toLocaleDateString();

    /* CHECK EXISTING OPEN TIME IN */

    let existing = attendance.find(r =>
        r.empid === emp.empid &&
        r.date === date &&
        r.timeout === ""
    );

    if(existing){

        alert("Already TIME IN");

        return;
    }

    /* LATE COMPUTATION */

    let lateMinutes = 0;

    let status = "ON TIME";

    let totalMinutes =
    now.getHours() * 60 + now.getMinutes();

    let officeTime = 8 * 60;

    if(totalMinutes > officeTime){

        lateMinutes =
        totalMinutes - officeTime;

        status = "LATE";
    }

    attendance.push({

        date:date,

        empid:emp.empid,

        name:
        emp.lname + ", " + emp.fname,

        timein:
        now.toLocaleTimeString(),

        breaktime:0,

        timeout:"",

        total:"0",

        late:
        lateMinutes + " mins",

        status:status

    });

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert("TIME IN SUCCESS");
}

/* =========================================
   TIME OUT
========================================= */

function timeOut(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    /* FIND ACTIVE ROW */

    let row =
    [...attendance]
    .reverse()
    .find(r =>
        r.empid === emp.empid &&
        r.timeout === ""
    );

    if(!row){

        alert("No active TIME IN");

        return;
    }

    let now = new Date();

    row.timeout =
    now.toLocaleTimeString();

    /* BREAK */

    let breakMinutes =
    prompt("Enter Break Time in Minutes", "60");

    breakMinutes =
    parseInt(breakMinutes) || 0;

    row.breaktime =
    breakMinutes;

    /* COMPUTE HOURS */

    let start =
    new Date(row.date + " " + row.timein);

    let end =
    new Date(row.date + " " + row.timeout);

    let hrs =
    (end - start) / 1000 / 60 / 60;

    /* OVERNIGHT FIX */

    if(hrs < 0){
        hrs += 24;
    }

    /* LESS BREAK */

    hrs =
    hrs - (breakMinutes / 60);

    row.total =
    hrs.toFixed(2);

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert("TIME OUT SUCCESS");
}

/* =========================================
   RENDER TABLE
========================================= */

function render(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let tbody =
    document.getElementById("tbody");

    tbody.innerHTML = "";

    attendance
    .filter(r => r.empid === emp.empid)
    .reverse()
    .forEach(r => {

        tbody.innerHTML += `

        <tr>

            <td>${r.date}</td>

            <td>${r.empid}</td>

            <td>${r.name}</td>

            <td>${r.timein}</td>

            <td>${r.breaktime} mins</td>

            <td>${r.timeout}</td>

            <td>${r.total}</td>

            <td class="late">
                ${r.late}
            </td>

            <td class="
                ${r.status === 'LATE'
                ? 'late'
                : 'ontime'}
            ">
                ${r.status}
            </td>

        </tr>

        `;
    });
}

render();

</script>

</body>
</html>
