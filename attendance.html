<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Papprito Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,0.6),
    rgba(0,0,0,0.6)),
    url('bg.jpg');

    background-size:cover;
    background-position:center;
}

/* LOGIN BOX */

.box{

    width:400px;

    background:white;

    border-radius:15px;

    overflow:hidden;

    box-shadow:0 0 20px rgba(0,0,0,0.4);

    animation:fade 0.5s ease;

}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* TOP */

.top{

    background:#d71920;

    color:white;

    text-align:center;

    padding:35px 20px;

}

.top img{

    width:100px;

    margin-bottom:10px;

}

.top h2{

    font-size:36px;

    font-weight:900;

}

.top p{

    margin-top:5px;

    opacity:0.9;

}

/* FORM */

.form{

    padding:30px;

}

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:6px;

    font-weight:bold;

    color:#444;

}

.input-group input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:16px;

    transition:0.3s;

}

.input-group input:focus{

    border-color:#d71920;

    outline:none;

    box-shadow:0 0 5px rgba(215,25,32,0.4);

}

/* BUTTON */

.loginBtn{

    width:100%;

    padding:14px;

    background:#d71920;

    color:white;

    border:none;

    border-radius:6px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}

.loginBtn:hover{

    background:#b81418;

    transform:scale(1.02);

}

/* LOGIN INFO */

.defaultBox{

    margin-top:20px;

    background:#f5f5f5;

    padding:15px;

    border-radius:8px;

    font-size:14px;

    color:#333;

}

.defaultBox p{

    margin:5px 0;

}

/* FOOTER */

.footer{

    text-align:center;

    padding:15px;

    font-size:13px;

    color:#888;

}

</style>
</head>

<body>

<div class="box">

    <!-- TOP -->

    <div class="top">

        <!-- CHANGE LOGO -->
        <img src="logo.png">

        <h2>PAPPRITO</h2>

        <p>Admin Attendance System</p>

    </div>

    <!-- FORM -->

    <div class="form">

        <!-- USERNAME -->

        <div class="input-group">

            <label>Username</label>

            <input type="text"
            id="username"
            placeholder="Enter Username">

        </div>

        <!-- PASSWORD -->

        <div class="input-group">

            <label>Password</label>

            <input type="password"
            id="password"
            placeholder="Enter Password">

        </div>

        <!-- LOGIN BUTTON -->

        <button class="loginBtn"
        onclick="login()">

            LOGIN

        </button>

        <!-- DEFAULT -->

        <div class="defaultBox">

            <p>
                <b>Default Username:</b>
                admin
            </p>

            <p>
                <b>Default Password:</b>
                123
            </p>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="footer">

        Papprito HR Management System

    </div>

</div>

<script>

/* DEFAULT ADMIN */

if(!localStorage.getItem("admin")){

    let admin = {

        username:"admin",

        password:"123"

    };

    localStorage.setItem(
        "admin",
        JSON.stringify(admin)
    );

}

/* LOGIN */

function login(){

    let username =
    document.getElementById("username")
    .value
    .trim();

    let password =
    document.getElementById("password")
    .value
    .trim();

    let admin =
    JSON.parse(localStorage.getItem("admin"));

    if(

        username === admin.username

        &&

        password === admin.password

    ){

        alert("Login Successful");

        window.location.href =
        "index.html";

    }

    else{

        alert("Invalid Username or Password");

    }

}

/* ENTER KEY */

document.addEventListener("keypress",

function(e){

    if(e.key==="Enter"){

        login();

    }

});

</script>

</body>
</html>
