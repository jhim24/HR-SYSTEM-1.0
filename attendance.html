<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Papprito Attendance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#e5e5e5;
}

/* MAIN SHEET */

.sheet{
    width:1100px;
    margin:20px auto;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    overflow:hidden;
}

/* HEADER */

.top-banner{
    background:#d71920;
    color:white;
    text-align:center;
    padding:40px 20px;
}

.logo{
    width:130px;
    margin-bottom:10px;
}

.top-banner h1{
    font-size:60px;
    font-weight:900;
    margin-top:10px;
}

/* BUTTONS */

.action-btns{
    display:flex;
    justify-content:center;
    gap:120px;
    margin-top:40px;
}

.action-btns button{
    width:220px;
    padding:18px;
    border:3px solid white;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.action-btns button:hover{
    transform:scale(1.05);
}

.timein{
    background:#11b44b;
}

.timeout{
    background:#ff0000;
}

/* TABLE */

.table-box{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:yellow;
    color:black;
    border:1px solid #444;
    padding:12px;
    font-size:22px;
}

td{
    border:1px solid #777;
    padding:10px;
    text-align:center;
    font-size:20px;
}

/* INPUT SECTION */

.controls{
    padding:20px;
    background:#f8f8f8;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.controls input,
.controls select{
    padding:10px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:5px;
}

.saveBtn{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:18px;
}

.saveBtn:hover{
    background:#217dbb;
}

/* ACTION BUTTONS */

.editBtn{
    background:#3498db;
    color:white;
    border:none;
    padding:5px 10px;
    cursor:pointer;
}

.deleteBtn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:5px 10px;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:1200px){

.sheet{
    width:95%;
}

.top-banner h1{
    font-size:40px;
}

.action-btns{
    gap:20px;
}

.action-btns button{
    width:150px;
    font-size:20px;
}

th,td{
    font-size:14px;
}

}

</style>
</head>

<body>

<div class="sheet">

    <!-- HEADER -->

    <div class="top-banner">

        <!-- CHANGE LOGO HERE -->
        <img src="logo.png" class="logo">

        <h1>EMPLOYEE ATTENDANCE</h1>

        <div class="action-btns">

            <button class="timein" onclick="autoTimeIn()">
                TIME IN
            </button>

            <button class="timeout" onclick="autoTimeOut()">
                TIME OUT
            </button>

        </div>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

        <select id="emp"></select>

        <input type="date" id="date">

        <input type="time" id="timeIn">

        <input type="time" id="timeOut">

        <input type="number" id="breakTime" placeholder="Break Minutes">

        <button class="saveBtn" onclick="addRow()">
            SAVE
        </button>

    </div>

    <!-- TABLE -->

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th>DATE</th>
                    <th>EMP ID</th>
                    <th>EMP NAME</th>
                    <th>TIME IN</th>
                    <th>TIME OUT</th>
                    <th>BREAK</th>
                    <th>TOTAL HOURS</th>
                    <th>LATE</th>
                    <th>OT</th>
                    <th>ACTION</th>
                </tr>

            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

</div>

<script>

/* SAMPLE EMPLOYEES */

let employees = JSON.parse(localStorage.getItem("employees")) || [

    {
        id:"PP80050",
        fname:"Rusty",
        lname:"DEGAMHON"
    },

    {
        id:"PP80134",
        fname:"Joemarie",
        lname:"MACALALAD"
    }

];

let data = JSON.parse(localStorage.getItem("attendance")) || [];

let editIndex = -1;

/* LOAD EMPLOYEE */

function loadEmp(){

    let emp = document.getElementById("emp");

    emp.innerHTML="";

    employees.forEach(e=>{

        emp.innerHTML += `
        <option value="${e.id}">
            ${e.id} - ${e.lname}, ${e.fname}
        </option>`;

    });

}

/* COMPUTE HOURS */

function compute(tin,tout,br){

    if(!tin || !tout){

        return {
            total:0,
            late:0,
            ot:0
        };

    }

    let s = new Date("2000-01-01 "+tin);

    let e = new Date("2000-01-01 "+tout);

    if(e < s){

        e.setDate(e.getDate()+1);

    }

    let hours = (e-s)/1000/60/60;

    hours -= (br||0)/60;

    let late = s > new Date("2000-01-01 08:00")

    ? (s - new Date("2000-01-01 08:00"))/1000/60

    : 0;

    let ot = hours > 8 ? hours-8 : 0;

    return {

        total:hours.toFixed(1),

        late:Math.floor(late),

        ot:ot.toFixed(1)

    };

}

/* SAVE */

function addRow(){

    let empValue = document.getElementById("emp").value;

    let empData = employees.find(e=>e.id===empValue);

    let date = document.getElementById("date").value;

    let tin = document.getElementById("timeIn").value;

    let tout = document.getElementById("timeOut").value;

    let br = document.getElementById("breakTime").value || 0;

    if(!empData || !date){

        alert("Complete fields");

        return;

    }

    let c = compute(tin,tout,br);

    let row = {

        date,

        empid:empData.id,

        name:empData.lname + ", " + empData.fname,

        tin,

        tout,

        br,

        total:c.total,

        late:c.late,

        ot:c.ot

    };

    if(editIndex===-1){

        data.push(row);

    }else{

        data[editIndex]=row;

        editIndex=-1;

    }

    localStorage.setItem("attendance",JSON.stringify(data));

    clearFields();

    render();

}

/* CLEAR */

function clearFields(){

    document.getElementById("date").value="";

    document.getElementById("timeIn").value="";

    document.getElementById("timeOut").value="";

    document.getElementById("breakTime").value="";

}

/* RENDER */

function render(){

    let tbody = document.getElementById("tbody");

    tbody.innerHTML="";

    data.forEach((r,i)=>{

        tbody.innerHTML += `

        <tr>

            <td>${r.date}</td>

            <td>${r.empid}</td>

            <td>${r.name}</td>

            <td>${r.tin}</td>

            <td>${r.tout}</td>

            <td>${r.br}</td>

            <td>${r.total}</td>

            <td>${r.late}</td>

            <td>${r.ot}</td>

            <td>

                <button class="editBtn"
                onclick="editRow(${i})">

                    Edit

                </button>

                <button class="deleteBtn"
                onclick="deleteRow(${i})">

                    Delete

                </button>

            </td>

        </tr>`;

    });

}

/* EDIT */

function editRow(i){

    let r = data[i];

    document.getElementById("date").value=r.date;

    document.getElementById("timeIn").value=r.tin;

    document.getElementById("timeOut").value=r.tout;

    document.getElementById("breakTime").value=r.br;

    document.getElementById("emp").value=r.empid;

    editIndex=i;

}

/* DELETE */

function deleteRow(i){

    if(confirm("Delete record?")){

        data.splice(i,1);

        localStorage.setItem("attendance",JSON.stringify(data));

        render();

    }

}

/* AUTO TIME IN */

function autoTimeIn(){

    let now = new Date();

    let time = now.toTimeString().slice(0,5);

    document.getElementById("timeIn").value=time;

}

/* AUTO TIME OUT */

function autoTimeOut(){

    let now = new Date();

    let time = now.toTimeString().slice(0,5);

    document.getElementById("timeOut").value=time;

}

loadEmp();

render();

</script>

</body>
</html>
