<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Papprito Attendance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#ececec;
}

/* MAIN */

.container{
    width:1000px;
    margin:20px auto;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

/* HEADER */

.top{
    background:#d71920;
    padding:40px 20px 60px;
    text-align:center;
    color:white;
}

.logo{
    width:100px;
    margin-bottom:10px;
}

.title{
    font-size:60px;
    font-weight:900;
    margin-top:10px;
}

/* EMPLOYEE INFO */

.emp-box{
    margin-top:30px;
    font-size:22px;
    line-height:1.8;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:120px;
    margin-top:40px;
}

.btn{
    width:220px;
    padding:18px;
    border:3px solid white;
    color:white;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.timein{
    background:#10b64d;
}

.timeout{
    background:#ff0000;
}

/* TABLE */

.table-box{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:yellow;
    color:black;
    border:1px solid #555;
    padding:12px;
    font-size:22px;
}

td{
    border:1px solid #777;
    padding:10px;
    text-align:center;
    font-size:20px;
}

/* CLOCK */

.clock{
    margin-top:20px;
    font-size:30px;
    font-weight:bold;
}

.date{
    font-size:22px;
    margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

    <div class="top">

        <!-- LOGO -->
        <img src="logo.png" class="logo">

        <div class="title">
            EMPLOYEE ATTENDANCE
        </div>

        <!-- EMPLOYEE INFO -->
        <div class="emp-box">
            <div id="empid"></div>
            <div id="empname"></div>
        </div>

        <!-- CLOCK -->
        <div class="clock" id="clock"></div>
        <div class="date" id="today"></div>

        <!-- BUTTONS -->
        <div class="buttons">

            <button class="btn timein" onclick="timeIn()">
                TIME IN
            </button>

            <button class="btn timeout" onclick="timeOut()">
                TIME OUT
            </button>

        </div>

    </div>

    <!-- TABLE -->
    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>DATE</th>
                    <th>EMP ID</th>
                    <th>EMP NAME</th>
                    <th>TIME IN</th>
                    <th>TIME OUT</th>
                    <th>TOTAL HOURS</th>
                </tr>
            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

</div>

<script>

/* =========================================
   SAMPLE MASTER LIST
========================================= */

if(!localStorage.getItem("employees")){

    let sampleEmployees = [

        {
            empid:"PP80050",
            fname:"Rusty",
            lname:"DEGAMHON",
            password:"1234"
        },

        {
            empid:"PP80134",
            fname:"Joemarie",
            lname:"MACALALAD",
            password:"1234"
        }

    ];

    localStorage.setItem(
        "employees",
        JSON.stringify(sampleEmployees)
    );
}

/* =========================================
   AUTO LOGIN DEMO
========================================= */

if(!localStorage.getItem("loggedEmployee")){

    let employees =
    JSON.parse(localStorage.getItem("employees"));

    localStorage.setItem(
        "loggedEmployee",
        JSON.stringify(employees[0])
    );
}

/* =========================================
   LOAD EMPLOYEE
========================================= */

let emp =
JSON.parse(localStorage.getItem("loggedEmployee"));

document.getElementById("empid").innerHTML =
"EMPLOYEE ID : " + emp.empid;

document.getElementById("empname").innerHTML =
"EMPLOYEE NAME : " +
emp.lname + ", " + emp.fname;

/* =========================================
   LIVE CLOCK
========================================= */

function updateClock(){

    let now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString();

    document.getElementById("today").innerHTML =
    now.toDateString();
}

setInterval(updateClock,1000);

updateClock();

/* =========================================
   TIME IN
========================================= */

function timeIn(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let now = new Date();

    let date =
    now.toLocaleDateString();

    /* CHECK DUPLICATE */

    let existing = attendance.find(r =>
        r.empid === emp.empid &&
        r.date === date &&
        r.timeout === ""
    );

    if(existing){
        alert("Already TIME IN");
        return;
    }

    attendance.push({

        date:date,

        empid:emp.empid,

        name:
        emp.lname + ", " + emp.fname,

        timein:
        now.toLocaleTimeString(),

        timeout:"",

        total:"0"

    });

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert("TIME IN SUCCESS");
}

/* =========================================
   TIME OUT
========================================= */

function timeOut(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let row = [...attendance].reverse().find(r =>
        r.empid === emp.empid &&
        r.timeout === ""
    );

    if(!row){
        alert("No active TIME IN");
        return;
    }

    let now = new Date();

    row.timeout =
    now.toLocaleTimeString();

    /* COMPUTE HOURS */

    let start =
    new Date(row.date + " " + row.timein);

    let end =
    new Date(row.date + " " + row.timeout);

    let hrs =
    (end-start)/1000/60/60;

    if(hrs < 0){
        hrs += 24;
    }

    row.total =
    hrs.toFixed(2);

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert("TIME OUT SUCCESS");
}

/* =========================================
   RENDER TABLE
========================================= */

function render(){

    let attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let tbody =
    document.getElementById("tbody");

    tbody.innerHTML = "";

    attendance
    .filter(r => r.empid === emp.empid)
    .reverse()
    .forEach(r => {

        tbody.innerHTML += `

        <tr>

            <td>${r.date}</td>

            <td>${r.empid}</td>

            <td>${r.name}</td>

            <td>${r.timein}</td>

            <td>${r.timeout}</td>

            <td>${r.total}</td>

        </tr>

        `;
    });
}

render();

</script>

</body>
</html>
