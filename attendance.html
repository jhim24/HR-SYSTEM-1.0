<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Papprito Attendance System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#e5e5e5;
    padding:15px;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* HEADER */

.top{
    background:#d71920;
    color:white;
    text-align:center;
    padding:20px;
}

.title{
    font-size:35px;
    font-weight:900;
}

/* DROPDOWN */

.select-box{
    margin-top:15px;
}

select{
    width:320px;
    padding:10px;
    border:none;
    border-radius:5px;
    font-size:16px;
}

/* EMPLOYEE INFO */

.emp-box{
    margin-top:15px;
    line-height:1.8;
    font-size:16px;
    font-weight:bold;
}

/* CLOCK */

.clock{
    margin-top:10px;
    font-size:30px;
    font-weight:bold;
}

.today{
    font-size:16px;
    margin-top:5px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

.btn{
    width:170px;
    padding:12px;
    border:none;
    border-radius:5px;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.timein{
    background:#12b347;
}

.timeout{
    background:#ff0000;
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:yellow;
    border:1px solid #555;
    padding:10px;
    font-size:15px;
}

td{
    border:1px solid #777;
    padding:8px;
    text-align:center;
    font-size:14px;
}

.late{
    color:red;
    font-weight:bold;
}

.ontime{
    color:green;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div class="title">
            EMPLOYEE ATTENDANCE
        </div>

        <!-- EMPLOYEE DROPDOWN -->

        <div class="select-box">

            <select id="employeeSelect"
            onchange="changeEmployee()">

            </select>

        </div>

        <!-- EMPLOYEE INFO -->

        <div class="emp-box">

            <div id="empid"></div>

            <div id="empname"></div>

        </div>

        <!-- CLOCK -->

        <div class="clock" id="clock"></div>

        <div class="today" id="today"></div>

        <!-- BUTTONS -->

        <div class="buttons">

            <button class="btn timein"
            onclick="timeIn()">

                TIME IN

            </button>

            <button class="btn timeout"
            onclick="timeOut()">

                TIME OUT

            </button>

        </div>

    </div>

    <!-- TABLE -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>DATE</th>
                    <th>EMP ID</th>
                    <th>EMPLOYEE NAME</th>
                    <th>TIME IN</th>
                    <th>BREAK</th>
                    <th>TIME OUT</th>
                    <th>TOTAL HOURS</th>
                    <th>LATE</th>
                    <th>STATUS</th>

                </tr>

            </thead>

            <tbody id="tbody"></tbody>

        </table>

    </div>

</div>

<script>

/* =========================================
   AUTO FIX OLD BROKEN DATA
========================================= */

let oldAttendance =
JSON.parse(localStorage.getItem("attendance")) || [];

oldAttendance = oldAttendance.filter(r =>
    r &&
    r.empid &&
    r.name
);

localStorage.setItem(
    "attendance",
    JSON.stringify(oldAttendance)
);

/* =========================================
   SAMPLE EMPLOYEE MASTER LIST
========================================= */

if(!localStorage.getItem("employees")){

    let employees = [

        {
            empid:"PP80050",
            fname:"Rusty",
            lname:"DEGAMHON"
        },

        {
            empid:"PP80134",
            fname:"Joemarie",
            lname:"MACALALAD"
        },

        {
            empid:"PP80199",
            fname:"Mark",
            lname:"SANTOS"
        },

        {
            empid:"PP80210",
            fname:"Kenneth",
            lname:"QUIRUBIN"
        }

    ];

    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );
}

/* =========================================
   VARIABLES
========================================= */

let employees =
JSON.parse(localStorage.getItem("employees")) || [];

let attendance =
JSON.parse(localStorage.getItem("attendance")) || [];

let currentEmployee =
employees[0];

/* =========================================
   LOAD DROPDOWN
========================================= */

function loadDropdown(){

    let select =
    document.getElementById("employeeSelect");

    select.innerHTML = "";

    employees.forEach((e,index)=>{

        select.innerHTML += `

        <option value="${index}">

            ${e.empid} -
            ${e.lname},
            ${e.fname}

        </option>

        `;
    });
}

/* =========================================
   CHANGE EMPLOYEE
========================================= */

function changeEmployee(){

    let index =
    document.getElementById("employeeSelect").value;

    currentEmployee =
    employees[index];

    loadEmployeeInfo();

    render();
}

/* =========================================
   LOAD EMPLOYEE INFO
========================================= */

function loadEmployeeInfo(){

    document.getElementById("empid").innerHTML =
    "EMPLOYEE ID : " +
    (currentEmployee.empid || "-");

    document.getElementById("empname").innerHTML =
    "EMPLOYEE NAME : " +
    currentEmployee.lname +
    ", " +
    currentEmployee.fname;
}

/* =========================================
   LIVE CLOCK
========================================= */

function updateClock(){

    let now = new Date();

    document.getElementById("clock").innerHTML =
    now.toLocaleTimeString();

    document.getElementById("today").innerHTML =
    now.toDateString();
}

setInterval(updateClock,1000);

updateClock();

/* =========================================
   TIME IN
========================================= */

function timeIn(){

    attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let now = new Date();

    let date =
    now.toLocaleDateString();

    /* CHECK ONLY CURRENT EMPLOYEE */

    let existing = attendance.find(r =>

        String(r.empid).trim() ===
        String(currentEmployee.empid).trim()

        &&

        r.date === date

        &&

        (
            r.timeout === "" ||
            r.timeout === null ||
            r.timeout === undefined
        )

    );

    if(existing){

        alert(
            currentEmployee.lname +
            " already TIME IN"
        );

        return;
    }

    /* LATE COMPUTATION */

    let lateMinutes = 0;

    let status = "ON TIME";

    let totalMinutes =
    now.getHours() * 60 +
    now.getMinutes();

    let officeTime = 8 * 60;

    if(totalMinutes > officeTime){

        lateMinutes =
        totalMinutes - officeTime;

        status = "LATE";
    }

    attendance.push({

        date:date,

        empid:
        currentEmployee.empid,

        name:
        currentEmployee.lname +
        ", " +
        currentEmployee.fname,

        timein:
        now.toLocaleTimeString(),

        breaktime:0,

        timeout:"",

        total:"0",

        late:
        lateMinutes + " mins",

        status:status

    });

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert(
        currentEmployee.lname +
        " TIME IN SUCCESS"
    );
}

/* =========================================
   TIME OUT
========================================= */

function timeOut(){

    attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let row =
    [...attendance]
    .reverse()
    .find(r =>

        String(r.empid).trim() ===
        String(currentEmployee.empid).trim()

        &&

        (
            r.timeout === "" ||
            r.timeout === null ||
            r.timeout === undefined
        )

    );

    if(!row){

        alert(
            currentEmployee.lname +
            " has no active TIME IN"
        );

        return;
    }

    let now = new Date();

    row.timeout =
    now.toLocaleTimeString();

    /* BREAK */

    let breakMinutes =
    prompt(
        "Enter Break Time in Minutes",
        "60"
    );

    breakMinutes =
    parseInt(breakMinutes) || 0;

    row.breaktime =
    breakMinutes;

    /* COMPUTE HOURS */

    let start =
    new Date(
        row.date + " " + row.timein
    );

    let end =
    new Date(
        row.date + " " + row.timeout
    );

    let hrs =
    (end-start)/1000/60/60;

    /* OVERNIGHT FIX */

    if(hrs < 0){
        hrs += 24;
    }

    /* LESS BREAK */

    hrs =
    hrs - (breakMinutes/60);

    if(hrs < 0){
        hrs = 0;
    }

    row.total =
    hrs.toFixed(2);

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();

    alert(
        currentEmployee.lname +
        " TIME OUT SUCCESS"
    );
}

/* =========================================
   RENDER TABLE
========================================= */

function render(){

    attendance =
    JSON.parse(localStorage.getItem("attendance")) || [];

    let tbody =
    document.getElementById("tbody");

    tbody.innerHTML = "";

    attendance
    .filter(r =>

        String(r.empid).trim() ===
        String(currentEmployee.empid).trim()

    )
    .reverse()
    .forEach(r => {

        tbody.innerHTML += `

        <tr>

            <td>${r.date || '-'}</td>

            <td>${r.empid || '-'}</td>

            <td>${r.name || '-'}</td>

            <td>${r.timein || '-'}</td>

            <td>${r.breaktime || 0} mins</td>

            <td>${r.timeout || '-'}</td>

            <td>${r.total || 0}</td>

            <td class="late">
                ${r.late || '0 mins'}
            </td>

            <td class="
                ${r.status === 'LATE'
                ? 'late'
                : 'ontime'}
            ">
                ${r.status || 'ON TIME'}
            </td>

        </tr>

        `;
    });
}

/* =========================================
   START
========================================= */

loadDropdown();

loadEmployeeInfo();

render();

</script>

</body>
</html>
