<!DOCTYPE html>
<html>
<head>

<title>Payroll System</title>

<!-- FONT AWESOME -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  font-family:'Segoe UI';
  background:url('bg.jpg') no-repeat center center fixed;
  background-size:cover;
  color:white;
}

.wrapper{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:240px;
  background:rgba(0,0,0,0.7);
  padding:20px;
  backdrop-filter:blur(10px);
}

.sidebar h3{
  margin-top:0;
}

.menu{
  padding:0;
}

.menu li{
  list-style:none;
  padding:12px;
  cursor:pointer;
  border-radius:8px;
  margin-bottom:6px;
  transition:0.2s;
}

.menu li:hover{
  background:rgba(255,255,255,0.15);
}

.menu li i{
  margin-right:10px;
}

/* MAIN */

.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

/* FORM */

.form-box{
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
  backdrop-filter:blur(10px);
}

/* GRID */

.form-grid{
  display:grid;
  grid-template-columns:
  repeat(auto-fit,minmax(160px,1fr));
  gap:10px;
}

/* INPUT */

input,
select{
  padding:10px;
  border-radius:8px;
  border:none;
  font-size:13px;
  background:white;
  color:#2c3e50;
  outline:none;
}

input:focus,
select:focus{
  box-shadow:0 0 5px #3498db;
}

/* BUTTON */

.btn{
  padding:9px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
  font-size:13px;
}

.save{
  background:#2ecc71;
}

.edit{
  background:#3498db;
}

.delete{
  background:#e74c3c;
}

/* TABLE */

.table-box{
  background:#eaf4ff;
  padding:10px;
  border-radius:15px;
  overflow:auto;
}

table{
  width:100%;
  min-width:1500px;
  border-collapse:collapse;
  color:#2c3e50;
  font-size:12px;
}

th,td{
  border:1px solid #ccc;
  padding:8px;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#3c89b8;
  color:white;
}

/* TOTAL */

.total{
  font-weight:bold;
  color:green;
}

</style>

</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>HR SYSTEM</h3>

<ul class="menu">

<li onclick="goPage('index.html')">

<i class="fa-solid fa-house"></i>

Dashboard

</li>

<li onclick="goPage('employee.html')">

<i class="fa-solid fa-users"></i>

Employees

</li>

<li onclick="goPage('attendance.html')">

<i class="fa-solid fa-clock"></i>

Attendance

</li>

<li onclick="goPage('payroll.html')">

<i class="fa-solid fa-money-bill"></i>

Payroll

</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">

<h2>

<i class="fa-solid fa-money-check-dollar"></i>

Payroll System

</h2>

<!-- FORM -->

<div class="form-box">

<div class="form-grid">

<select id="emp"></select>

<input id="days"
type="number"
placeholder="Total Days">

<input id="rate"
type="number"
placeholder="Daily Rate">

<input id="ot"
type="number"
placeholder="Overtime">

<input id="holiday"
type="number"
placeholder="Holiday Pay">

<input id="sick"
type="number"
placeholder="Sick Leave">

<input id="bday"
type="number"
placeholder="Birthday Leave">

<input id="vacation"
type="number"
placeholder="Vacation Leave">

<input id="sss"
type="number"
placeholder="SSS">

<input id="pagibig"
type="number"
placeholder="Pag-IBIG">

<input id="philhealth"
type="number"
placeholder="PhilHealth">

<input id="health"
type="number"
placeholder="Health Card">

<input id="others"
type="number"
placeholder="Others">

<input id="loan"
type="number"
placeholder="Loan">

</div>

<br>

<button class="btn save"
onclick="savePayroll()">

<i class="fa-solid fa-floppy-disk"></i>

Compute & Save

</button>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="tbl">

<thead>

<tr>

<th>EMP ID</th>

<th>Name</th>

<th>Days</th>

<th>Rate</th>

<th>Gross</th>

<th>OT</th>

<th>Holiday</th>

<th>Sick</th>

<th>Bday</th>

<th>Vacation</th>

<th>SSS</th>

<th>Pagibig</th>

<th>Philhealth</th>

<th>Health</th>

<th>Others</th>

<th>Loan</th>

<th>Net Pay</th>

<th>Action</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
addDoc,
updateDoc,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain:
"pappritohr.firebaseapp.com",

projectId:
"pappritohr",

storageBucket:
"pappritohr.firebasestorage.app",

messagingSenderId:
"559428820611",

appId:
"1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId:
"G-1CEQ4P5XW8"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* =====================================
   EMPLOYEES
===================================== */

let empList = [];

async function loadEmp(){

  emp.innerHTML = "";

  empList = [];

  const querySnapshot =

  await getDocs(
    collection(db,"employees")
  );

  querySnapshot.forEach((d)=>{

    let e = d.data();

    empList.push(e);

    emp.innerHTML += `

    <option value="${e.empid}">

    ${e.empid} -
    ${e.fname} ${e.lname}

    </option>

    `;
  });
}

/* =====================================
   PAYROLL
===================================== */

let payroll = [];

let editId = null;

async function loadPayroll(){

  payroll = [];

  const querySnapshot =

  await getDocs(
    collection(db,"payroll")
  );

  querySnapshot.forEach((d)=>{

    let row = d.data();

    row.docId = d.id;

    payroll.push(row);
  });

  render();
}

/* =====================================
   SAVE
===================================== */

window.savePayroll = async function(){

  let selectedEmp =

  empList.find(e =>

    e.empid == emp.value
  );

  if(!selectedEmp){

    alert("Employee not found");

    return;
  }

  let empid =
  selectedEmp.empid;

  let name =

  selectedEmp.fname +

  " " +

  selectedEmp.lname;

  let daysVal =
  Number(days.value || 0);

  let rateVal =
  Number(rate.value || 0);

  let gross =
  daysVal * rateVal;

  let earnings =

    Number(ot.value || 0)+
    Number(holiday.value || 0)+
    Number(sick.value || 0)+
    Number(bday.value || 0)+
    Number(vacation.value || 0);

  let deduction =

    Number(sss.value || 0)+
    Number(pagibig.value || 0)+
    Number(philhealth.value || 0)+
    Number(health.value || 0)+
    Number(others.value || 0)+
    Number(loan.value || 0);

  let net =
  gross + earnings - deduction;

  let row = {

    empid,

    name,

    days:daysVal,

    rate:rateVal,

    gross,

    ot:Number(ot.value || 0),

    holiday:Number(holiday.value || 0),

    sick:Number(sick.value || 0),

    bday:Number(bday.value || 0),

    vacation:Number(vacation.value || 0),

    sss:Number(sss.value || 0),

    pagibig:Number(pagibig.value || 0),

    philhealth:Number(philhealth.value || 0),

    health:Number(health.value || 0),

    others:Number(others.value || 0),

    loan:Number(loan.value || 0),

    net

  };

  /* UPDATE */

  if(editId){

    await updateDoc(

      doc(db,"payroll",editId),

      row

    );

    editId = null;

    alert("Payroll Updated");
  }

  /* ADD */

  else{

    await addDoc(

      collection(db,"payroll"),

      row

    );

    alert("Payroll Saved");
  }

  clearForm();

  loadPayroll();
}

/* =====================================
   EDIT
===================================== */

window.editRow = function(id){

  let r = payroll.find(x =>

    x.docId === id
  );

  if(!r){
    return;
  }

  emp.value = r.empid;

  days.value = r.days;

  rate.value = r.rate;

  ot.value = r.ot;

  holiday.value = r.holiday;

  sick.value = r.sick;

  bday.value = r.bday;

  vacation.value = r.vacation;

  sss.value = r.sss;

  pagibig.value = r.pagibig;

  philhealth.value = r.philhealth;

  health.value = r.health;

  others.value = r.others;

  loan.value = r.loan;

  editId = r.docId;

  window.scrollTo({

    top:0,

    behavior:'smooth'

  });
}

/* =====================================
   DELETE
===================================== */

window.deleteRow = async function(id){

  let confirmDelete =

  confirm(
    "Delete payroll?"
  );

  if(!confirmDelete){
    return;
  }

  await deleteDoc(

    doc(db,"payroll",id)

  );

  loadPayroll();
}

/* =====================================
   RENDER
===================================== */

function render(){

  let tbody =

  document.querySelector(
    "#tbl tbody"
  );

  tbody.innerHTML = "";

  payroll.forEach((r)=>{

    tbody.innerHTML += `

    <tr>

      <td>

      ${r.empid || "-"}

      </td>

      <td>

      ${r.name || "-"}

      </td>

      <td>

      ${r.days || 0}

      </td>

      <td>

      ${r.rate || 0}

      </td>

      <td>

      ${r.gross || 0}

      </td>

      <td>

      ${r.ot || 0}

      </td>

      <td>

      ${r.holiday || 0}

      </td>

      <td>

      ${r.sick || 0}

      </td>

      <td>

      ${r.bday || 0}

      </td>

      <td>

      ${r.vacation || 0}

      </td>

      <td>

      ${r.sss || 0}

      </td>

      <td>

      ${r.pagibig || 0}

      </td>

      <td>

      ${r.philhealth || 0}

      </td>

      <td>

      ${r.health || 0}

      </td>

      <td>

      ${r.others || 0}

      </td>

      <td>

      ${r.loan || 0}

      </td>

      <td class="total">

      ${Number(r.net || 0)
      .toFixed(2)}

      </td>

      <td>

        <button

        class="btn edit"

        onclick="editRow('${r.docId}')">

        Edit

        </button>

        <button

        class="btn delete"

        onclick="deleteRow('${r.docId}')">

        Delete

        </button>

      </td>

    </tr>

    `;
  });
}

/* =====================================
   CLEAR
===================================== */

function clearForm(){

  days.value = "";
  rate.value = "";
  ot.value = "";
  holiday.value = "";
  sick.value = "";
  bday.value = "";
  vacation.value = "";
  sss.value = "";
  pagibig.value = "";
  philhealth.value = "";
  health.value = "";
  others.value = "";
  loan.value = "";
}

/* =====================================
   PAGE
===================================== */

window.goPage = function(p){

  window.location.href = p;
}

/* START */

loadEmp();

loadPayroll();

</script>

</body>
</html>
