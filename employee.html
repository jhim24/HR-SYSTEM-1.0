<!DOCTYPE html>
<html>
<head>

<title>Employee Masterlist</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
margin:0;
background:#d4d0c8;
color:black;
}

/* MAIN */

.wrapper{
width:100%;
min-height:100vh;
}

.main{
width:100%;
padding:15px;
overflow-y:auto;
}

/* TITLE */

h2{
margin-top:0;
margin-bottom:10px;
}

/* CLASSIC TABS */

.classic-tabs{

display:flex;
flex-wrap:wrap;

gap:2px;

background:#c0c0c0;

padding:4px 4px 0 4px;

border:1px solid #808080;

border-bottom:none;

overflow-x:auto;
}

.tab-btn{

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

padding:6px 14px;

font-size:12px;

font-weight:bold;

cursor:pointer;

white-space:nowrap;
}

.tab-btn.active{

background:white;

border-bottom:1px solid white;

position:relative;

top:1px;
}

/* FORM */

.form-box{

background:white;

border:1px solid #808080;

border-top:none;

padding:15px;

margin-bottom:20px;
}

.form-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:8px;
}

/* INPUT */

input,
select{

padding:8px;

border:1px solid #808080;

font-size:12px;

background:white;

color:black;
}

input:focus,
select:focus{

outline:none;

border:1px solid #0066cc;
}

/* BUTTON */

.add-btn{

margin-top:10px;

padding:10px 15px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-weight:bold;
}

.add-btn:hover{
background:#efefef;
}

.btn{

padding:5px 10px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-size:11px;
}

/* TABLE */

.table-box{

background:white;

border:1px solid #808080;

overflow-x:auto;

width:100%;
}

table{

width:100%;

min-width:1700px;

border-collapse:collapse;

font-size:12px;
}

th,
td{

padding:6px;

border:1px solid #808080;

text-align:left;

white-space:nowrap;
}

th{

background:#dcdcdc;

position:sticky;

top:0;

z-index:2;
}

/* SEARCH */

.search-box{
margin-bottom:10px;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="wrapper">

<div class="main">

<h2>Employee Masterlist</h2>

<!-- TABS -->

<div class="classic-tabs">

<button class="tab-btn active">
Personal
</button>

<button class="tab-btn">
Contact
</button>

<button class="tab-btn">
Identification
</button>

<button class="tab-btn">
Job Related
</button>

<button class="tab-btn">
Allowances
</button>

<button class="tab-btn">
Deductions
</button>

<button class="tab-btn">
Leaves
</button>

<button class="tab-btn">
General
</button>

<button class="tab-btn">
Additional Info
</button>

<button class="tab-btn">
Application
</button>

</div>

<!-- FORM -->

<div class="form-box">

<div class="form-grid">

<input class="form-field"
id="fname"
placeholder="First Name">

<input class="form-field"
id="mname"
placeholder="Middle Name">

<input class="form-field"
id="lname"
placeholder="Last Name">

<input class="form-field"
type="date"
id="birthdate"
onchange="calcAge()">

<input class="form-field"
id="age"
placeholder="Age"
readonly>

<input class="form-field"
id="address"
placeholder="Address">

<select class="form-field"
id="bank">

<option>Bank Name</option>

<option>BPI</option>
<option>BDO</option>
<option>Metrobank</option>
<option>Landbank</option>

</select>

<input class="form-field"
id="bankAcc"
placeholder="Bank Account">

<input class="form-field"
id="empid"
placeholder="Employee ID">

<select class="form-field"
id="govId">

<option>Government ID</option>

<option>Passport</option>
<option>Driver License</option>
<option>National ID</option>

</select>

<input class="form-field"
id="sss"
placeholder="SSS">

<input class="form-field"
id="philhealth"
placeholder="PhilHealth">

<input class="form-field"
id="pagibig"
placeholder="Pag-IBIG">

<input class="form-field"
id="healthcard"
placeholder="Health Card">

<input class="form-field"
type="date"
id="joiningDate">

<select class="form-field"
id="employmentType">

<option>Employment Type</option>

<option>Regular</option>
<option>Probationary</option>
<option>Contractual</option>
<option>Part-Time</option>
<option>Seasonal</option>
<option>Intern</option>

</select>

<select class="form-field"
id="position">

<option>Position</option>

<option>Admin</option>
<option>Cashier</option>
<option>Waiter</option>
<option>Waitress</option>
<option>Manager</option>
<option>Supervisor</option>

</select>

</div>

<button class="add-btn"
onclick="addEmployee()">

Save Employee

</button>

</div>

<!-- SEARCH -->

<div class="search-box">

<input type="text"
id="search"
placeholder="Search..."
onkeyup="searchEmp()">

<span id="total"></span>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="empTable">

<thead>

<tr>

<th>First</th>
<th>Middle</th>
<th>Last</th>
<th>Birthdate</th>
<th>Age</th>
<th>Address</th>
<th>Bank</th>
<th>Account</th>
<th>Emp ID</th>
<th>Gov ID</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Health Card</th>
<th>Joining Date</th>
<th>Employment Type</th>
<th>Position</th>
<th>Action</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

<script>

/* TAB ACTIVE */

const tabs =
document.querySelectorAll('.tab-btn');

tabs.forEach(tab=>{

tab.addEventListener('click',()=>{

tabs.forEach(t=>
t.classList.remove('active')
);

tab.classList.add('active');

});

});

/* SAVE EMPLOYEE */

function addEmployee(){

let table =
document.querySelector(
'#empTable tbody'
);

let row =
document.createElement('tr');

row.innerHTML = `

<td>${fname.value}</td>

<td>${mname.value}</td>

<td>${lname.value}</td>

<td>${birthdate.value}</td>

<td>${age.value}</td>

<td>${address.value}</td>

<td>${bank.value}</td>

<td>${bankAcc.value}</td>

<td>${empid.value}</td>

<td>${govId.value}</td>

<td>${sss.value}</td>

<td>${philhealth.value}</td>

<td>${pagibig.value}</td>

<td>${healthcard.value}</td>

<td>${joiningDate.value}</td>

<td>${employmentType.value}</td>

<td>${position.value}</td>

<td>

<button
class='btn'
onclick='editRow(this)'>

Edit

</button>

<button
class='btn'
onclick='deleteRow(this)'>

Delete

</button>

</td>

`;

table.appendChild(row);

updateTotal();

clearForm();

alert('Employee Saved');

}

/* DELETE */

function deleteRow(btn){

btn.closest('tr').remove();

updateTotal();

}

/* EDIT */

function editRow(btn){

let row =
btn.closest('tr');

let cells =
row.querySelectorAll('td');

fname.value =
cells[0].innerText;

mname.value =
cells[1].innerText;

lname.value =
cells[2].innerText;

birthdate.value =
cells[3].innerText;

age.value =
cells[4].innerText;

address.value =
cells[5].innerText;

bank.value =
cells[6].innerText;

bankAcc.value =
cells[7].innerText;

empid.value =
cells[8].innerText;

govId.value =
cells[9].innerText;

sss.value =
cells[10].innerText;

philhealth.value =
cells[11].innerText;

pagibig.value =
cells[12].innerText;

healthcard.value =
cells[13].innerText;

joiningDate.value =
cells[14].innerText;

employmentType.value =
cells[15].innerText;

position.value =
cells[16].innerText;

row.remove();

updateTotal();

window.scrollTo({

top:0,

behavior:'smooth'

});

}

/* SEARCH */

function searchEmp(){

let val =
search.value.toLowerCase();

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

let visible = 0;

rows.forEach(row=>{

let show =
row.innerText
.toLowerCase()
.includes(val);

row.style.display =
show ? '' : 'none';

if(show) visible++;

});

total.innerText =
'Showing : ' + visible;

}

/* AGE */

function calcAge(){

let birth =
new Date(birthdate.value);

let today =
new Date();

let years =
today.getFullYear() -
birth.getFullYear();

let m =
today.getMonth() -
birth.getMonth();

if(
m < 0 ||

(m === 0 &&
today.getDate() <
birth.getDate())

){

years--;

}

age.value = years;

}

/* CLEAR FORM */

function clearForm(){

document
.querySelectorAll('.form-field')

.forEach(el=>{

el.value='';

});

}

/* TOTAL */

function updateTotal(){

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

total.innerText =
'Total : ' + rows.length;

}

</script>

</body>
</html>
