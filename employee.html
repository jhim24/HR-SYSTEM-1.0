<!DOCTYPE html>
<html>
<head>

<title>Employee Masterlist</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
margin:0;
background:#d4d0c8;
padding:15px;
}

/* TOP */

.top-bar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

h2{
margin:0;
}

/* BUTTON */

.add-btn,
.save-btn,
.btn{

padding:8px 15px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-weight:bold;
}

/* SEARCH */

.search-box{
margin-bottom:10px;
}

.search-box input{

padding:8px;

border:1px solid #808080;

width:250px;
}

/* TABLE */

.table-box{

background:white;

border:1px solid #808080;

overflow-x:auto;
}

table{

width:100%;

border-collapse:collapse;

min-width:1400px;

font-size:12px;
}

th,
td{

border:1px solid #808080;

padding:6px;

text-align:left;

white-space:nowrap;
}

th{
background:#dcdcdc;
}

/* MODAL */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,0.5);

justify-content:center;

align-items:center;

z-index:9999;
}

.modal-box{

background:white;

width:95%;

max-width:1200px;

height:95vh;

overflow:auto;

border:2px solid #808080;

padding:15px;

position:relative;
}

/* CLOSE */

.close-btn{

position:absolute;

top:10px;
right:10px;

padding:5px 10px;

cursor:pointer;
}

/* TABS */

.classic-tabs{

display:flex;
flex-wrap:wrap;

gap:2px;

background:#c0c0c0;

padding:4px 4px 0 4px;

border:1px solid #808080;

border-bottom:none;

margin-top:10px;
}

.tab-btn{

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

padding:6px 14px;

font-size:12px;

font-weight:bold;

cursor:pointer;
}

.tab-btn.active{

background:white;

border-bottom:1px solid white;
}

/* TAB CONTENT */

.tab-content{

display:none;

border:1px solid #808080;

padding:15px;

background:white;
}

.tab-content.active{
display:block;
}

/* FORM GRID */

.form-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));

gap:8px;
}

/* INPUT */

input,
select{

padding:8px;

border:1px solid #808080;

font-size:12px;
}

</style>

</head>

<body>

<div class="top-bar">

<h2>Employee Masterlist</h2>

<button class="add-btn"
onclick="openModal()">

+ Add Employee

</button>

</div>

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search..."
onkeyup="searchEmp()">

<span id="total"></span>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="empTable">

<thead>

<tr>

<th>First Name</th>
<th>Last Name</th>
<th>Mobile</th>
<th>Email</th>
<th>Position</th>
<th>Department</th>
<th>Employment</th>
<th>Action</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<!-- MODAL -->

<div class="modal"
id="employeeModal">

<div class="modal-box">

<button
class="close-btn"
onclick="closeModal()">

X

</button>

<h3>Employee Information</h3>

<!-- TABS -->

<div class="classic-tabs">

<button class="tab-btn active"
onclick="openTab(event,'personal')">
Personal
</button>

<button class="tab-btn"
onclick="openTab(event,'contact')">
Contact
</button>

<button class="tab-btn"
onclick="openTab(event,'identification')">
Identification
</button>

<button class="tab-btn"
onclick="openTab(event,'job')">
Job
</button>

<button class="tab-btn"
onclick="openTab(event,'allowances')">
Allowances
</button>

<button class="tab-btn"
onclick="openTab(event,'deductions')">
Deductions
</button>

<button class="tab-btn"
onclick="openTab(event,'leaves')">
Leaves
</button>

<button class="tab-btn"
onclick="openTab(event,'general')">
General
</button>

<button class="tab-btn"
onclick="openTab(event,'additional')">
Additional
</button>

<button class="tab-btn"
onclick="openTab(event,'application')">
Application
</button>

</div>

<!-- PERSONAL -->

<div id="personal"
class="tab-content active">

<div class="form-grid">

<input id="fname"
placeholder="First Name">

<input id="mname"
placeholder="Middle Name">

<input id="lname"
placeholder="Last Name">

<input type="date"
id="birthdate"
onchange="calcAge()">

<input id="age"
placeholder="Age"
readonly>

<select id="gender">

<option>Gender</option>

<option>Male</option>
<option>Female</option>

</select>

<select id="civilstatus">

<option>Civil Status</option>

<option>Single</option>
<option>Married</option>

</select>

<input id="nationality"
placeholder="Nationality">

<input id="religion"
placeholder="Religion">

<input type="file"
id="profilephoto">

</div>

</div>

<!-- CONTACT -->

<div id="contact"
class="tab-content">

<div class="form-grid">

<input id="mobile"
placeholder="Mobile Number">

<input id="email"
placeholder="Email Address">

<input id="currentaddress"
placeholder="Current Address">

<input id="permanentaddress"
placeholder="Permanent Address">

<input id="emergencycontact"
placeholder="Emergency Contact">

<input id="emergencynumber"
placeholder="Emergency Number">

</div>

</div>

<!-- IDENTIFICATION -->

<div id="identification"
class="tab-content">

<div class="form-grid">

<input id="empid"
placeholder="Employee ID">

<input id="sss"
placeholder="SSS">

<input id="philhealth"
placeholder="PhilHealth">

<input id="pagibig"
placeholder="Pag-IBIG">

<input id="tin"
placeholder="TIN">

<input id="passport"
placeholder="Passport">

<input id="nationalid"
placeholder="National ID">

<input id="healthcard"
placeholder="Health Card">

</div>

</div>

<!-- JOB -->

<div id="job"
class="tab-content">

<div class="form-grid">

<input id="position"
placeholder="Position">

<input id="department"
placeholder="Department">

<input id="branch"
placeholder="Branch">

<select id="employment">

<option>Employment Type</option>

<option>Regular</option>
<option>Probationary</option>
<option>Contractual</option>

</select>

<input type="date"
id="datehired">

<input id="supervisor"
placeholder="Supervisor">

<input id="schedule"
placeholder="Schedule">

<input id="salaryrate"
placeholder="Salary Rate">

</div>

</div>

<!-- ALLOWANCES -->

<div id="allowances"
class="tab-content">

<div class="form-grid">

<input id="mealallowance"
placeholder="Meal Allowance">

<input id="transportation"
placeholder="Transportation">

<input id="communication"
placeholder="Communication">

<input id="ricesubsidy"
placeholder="Rice Subsidy">

<input id="otherallowance"
placeholder="Other Allowance">

</div>

</div>

<!-- DEDUCTIONS -->

<div id="deductions"
class="tab-content">

<div class="form-grid">

<input id="sssdeduction"
placeholder="SSS Deduction">

<input id="pagibigdeduction"
placeholder="Pag-IBIG Deduction">

<input id="philhealthdeduction"
placeholder="PhilHealth Deduction">

<input id="cashadvance"
placeholder="Cash Advance">

<input id="loans"
placeholder="Loans">

<input id="latededuction"
placeholder="Late Deduction">

</div>

</div>

<!-- LEAVES -->

<div id="leaves"
class="tab-content">

<div class="form-grid">

<input id="vacationleave"
placeholder="Vacation Leave">

<input id="sickleave"
placeholder="Sick Leave">

<input id="emergencyleave"
placeholder="Emergency Leave">

<input id="maternityleave"
placeholder="Maternity Leave">

<input id="paternityleave"
placeholder="Paternity Leave">

<input id="leavebalance"
placeholder="Leave Balance">

</div>

</div>

<!-- GENERAL -->

<div id="general"
class="tab-content">

<div class="form-grid">

<input id="bankname"
placeholder="Bank Name">

<input id="bankaccount"
placeholder="Bank Account">

<input id="atmnumber"
placeholder="ATM Number">

<input id="uniformsize"
placeholder="Uniform Size">

<input id="bloodtype"
placeholder="Blood Type">

<input id="notes"
placeholder="Notes">

</div>

</div>

<!-- ADDITIONAL -->

<div id="additional"
class="tab-content">

<div class="form-grid">

<input id="education"
placeholder="Education">

<input id="skills"
placeholder="Skills">

<input id="experience"
placeholder="Experience">

<input id="training"
placeholder="Training">

<input id="certificates"
placeholder="Certificates">

<input id="references"
placeholder="References">

</div>

</div>

<!-- APPLICATION -->

<div id="application"
class="tab-content">

<div class="form-grid">

<input type="file"
id="resume">

<input id="nbi"
placeholder="NBI Clearance">

<input id="medical"
placeholder="Medical">

<input id="contract"
placeholder="Contract">

<select id="applicationstatus">

<option>Application Status</option>

<option>Pending</option>
<option>Approved</option>
<option>Rejected</option>

</select>

<input type="date"
id="interviewdate">

</div>

</div>

<button class="save-btn"
onclick="addEmployee()">

Save Employee

</button>

</div>

</div>

<script>

/* MODAL */

function openModal(){

employeeModal.style.display='flex';

}

function closeModal(){

employeeModal.style.display='none';

}

/* TAB */

function openTab(evt,tabId){

document
.querySelectorAll('.tab-content')

.forEach(tab=>{

tab.classList.remove('active');

});

document
.getElementById(tabId)

.classList.add('active');

document
.querySelectorAll('.tab-btn')

.forEach(btn=>{

btn.classList.remove('active');

});

evt.currentTarget
.classList.add('active');

}

/* AGE */

function calcAge(){

let birth =
new Date(birthdate.value);

let today =
new Date();

let years =
today.getFullYear() -
birth.getFullYear();

let m =
today.getMonth() -
birth.getMonth();

if(
m < 0 ||

(m === 0 &&
today.getDate() <
birth.getDate())

){

years--;

}

age.value = years;

}

/* SAVE */

function addEmployee(){

let table =
document.querySelector(
'#empTable tbody'
);

let row =
document.createElement('tr');

row.innerHTML = `

<td>${fname.value}</td>

<td>${lname.value}</td>

<td>${mobile.value}</td>

<td>${email.value}</td>

<td>${position.value}</td>

<td>${department.value}</td>

<td>${employment.value}</td>

<td>

<button class='btn'>
Edit
</button>

<button class='btn'
onclick='deleteRow(this)'>

Delete

</button>

</td>

`;

table.appendChild(row);

updateTotal();

closeModal();

clearForm();

alert('Employee Saved');

}

/* DELETE */

function deleteRow(btn){

btn.closest('tr').remove();

updateTotal();

}

/* SEARCH */

function searchEmp(){

let val =
search.value.toLowerCase();

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

let visible = 0;

rows.forEach(row=>{

let show =
row.innerText
.toLowerCase()
.includes(val);

row.style.display =
show ? '' : 'none';

if(show) visible++;

});

total.innerText =
'Showing : ' + visible;

}

/* CLEAR */

function clearForm(){

document
.querySelectorAll('input,select')

.forEach(el=>{

if(el.type!='button'){

el.value='';

}

});

}

/* TOTAL */

function updateTotal(){

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

total.innerText =
'Total : ' + rows.length;

}

</script>

</body>
</html>
