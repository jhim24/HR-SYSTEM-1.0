<!DOCTYPE html>
<html>
<head>

<title>Employee Masterlist</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
margin:0;
background:#d4d0c8;
padding:15px;
}

/* TITLE */

.top-bar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:15px;
}

h2{
margin:0;
}

/* BUTTON */

.add-btn{

padding:10px 16px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-weight:bold;
}

.add-btn:hover{
background:#efefef;
}

/* SEARCH */

.search-box{
margin-bottom:10px;
}

.search-box input{

padding:8px;

border:1px solid #808080;

width:250px;
}

/* TABLE */

.table-box{

background:white;

border:1px solid #808080;

overflow-x:auto;
}

table{

width:100%;

border-collapse:collapse;

min-width:1200px;

font-size:12px;
}

th,
td{

border:1px solid #808080;

padding:6px;

text-align:left;

white-space:nowrap;
}

th{
background:#dcdcdc;
}

/* ACTION BUTTON */

.btn{

padding:4px 10px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-size:11px;
}

/* MODAL */

.modal{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,0.5);

justify-content:center;

align-items:center;

z-index:9999;
}

.modal-box{

background:white;

width:95%;

max-width:1000px;

height:90vh;

overflow:auto;

border:2px solid #808080;

padding:15px;

position:relative;
}

/* CLOSE */

.close-btn{

position:absolute;

top:10px;
right:10px;

padding:5px 10px;

cursor:pointer;
}

/* TABS */

.classic-tabs{

display:flex;
flex-wrap:wrap;

gap:2px;

background:#c0c0c0;

padding:4px 4px 0 4px;

border:1px solid #808080;

border-bottom:none;

margin-top:10px;
}

.tab-btn{

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

padding:6px 14px;

font-size:12px;

font-weight:bold;

cursor:pointer;
}

.tab-btn.active{

background:white;

border-bottom:1px solid white;
}

/* TAB CONTENT */

.tab-content{

display:none;

border:1px solid #808080;

padding:15px;

background:white;
}

.tab-content.active{
display:block;
}

/* FORM GRID */

.form-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:8px;
}

/* INPUT */

input,
select{

padding:8px;

border:1px solid #808080;

font-size:12px;
}

/* SAVE */

.save-btn{

margin-top:15px;

padding:10px 20px;

background:#dcdcdc;

border-top:1px solid white;
border-left:1px solid white;

border-right:1px solid #808080;
border-bottom:1px solid #808080;

cursor:pointer;

font-weight:bold;
}

</style>

</head>

<body>

<div class="top-bar">

<h2>Employee Masterlist</h2>

<button class="add-btn"
onclick="openModal()">

+ Add Employee

</button>

</div>

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search..."
onkeyup="searchEmp()">

<span id="total"></span>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="empTable">

<thead>

<tr>

<th>First</th>
<th>Middle</th>
<th>Last</th>
<th>Mobile</th>
<th>Email</th>
<th>Position</th>
<th>Department</th>
<th>Action</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<!-- MODAL -->

<div class="modal"
id="employeeModal">

<div class="modal-box">

<button
class="close-btn"
onclick="closeModal()">

X

</button>

<h3>Employee Information</h3>

<!-- TABS -->

<div class="classic-tabs">

<button
class="tab-btn active"
onclick="openTab(event,'personal')">

Personal

</button>

<button
class="tab-btn"
onclick="openTab(event,'contact')">

Contact

</button>

<button
class="tab-btn"
onclick="openTab(event,'job')">

Job

</button>

</div>

<!-- PERSONAL -->

<div
id="personal"
class="tab-content active">

<div class="form-grid">

<input id="fname"
placeholder="First Name">

<input id="mname"
placeholder="Middle Name">

<input id="lname"
placeholder="Last Name">

<input
type="date"
id="birthdate"
onchange="calcAge()">

<input
id="age"
placeholder="Age"
readonly>

<select id="gender">

<option>Gender</option>

<option>Male</option>

<option>Female</option>

</select>

</div>

</div>

<!-- CONTACT -->

<div
id="contact"
class="tab-content">

<div class="form-grid">

<input id="mobile"
placeholder="Mobile Number">

<input id="email"
placeholder="Email Address">

<input id="address"
placeholder="Address">

<input id="emergency"
placeholder="Emergency Contact">

</div>

</div>

<!-- JOB -->

<div
id="job"
class="tab-content">

<div class="form-grid">

<input id="empid"
placeholder="Employee ID">

<select id="department">

<option>Department</option>

<option>HR</option>

<option>Accounting</option>

<option>Operations</option>

</select>

<select id="position">

<option>Position</option>

<option>Manager</option>

<option>Supervisor</option>

<option>Cashier</option>

<option>Staff</option>

</select>

<select id="employment">

<option>Employment Type</option>

<option>Regular</option>

<option>Probationary</option>

<option>Contractual</option>

</select>

</div>

</div>

<button
class="save-btn"
onclick="addEmployee()">

Save Employee

</button>

</div>

</div>

<script>

/* MODAL */

function openModal(){

employeeModal.style.display='flex';

}

function closeModal(){

employeeModal.style.display='none';

}

/* TAB */

function openTab(evt,tabId){

document
.querySelectorAll('.tab-content')

.forEach(tab=>{

tab.classList.remove('active');

});

document
.getElementById(tabId)

.classList.add('active');

document
.querySelectorAll('.tab-btn')

.forEach(btn=>{

btn.classList.remove('active');

});

evt.currentTarget
.classList.add('active');

}

/* AGE */

function calcAge(){

let birth =
new Date(birthdate.value);

let today =
new Date();

let years =
today.getFullYear() -
birth.getFullYear();

let m =
today.getMonth() -
birth.getMonth();

if(
m < 0 ||

(m === 0 &&
today.getDate() <
birth.getDate())

){

years--;

}

age.value = years;

}

/* SAVE */

function addEmployee(){

let table =
document.querySelector(
'#empTable tbody'
);

let row =
document.createElement('tr');

row.innerHTML = `

<td>${fname.value}</td>

<td>${mname.value}</td>

<td>${lname.value}</td>

<td>${mobile.value}</td>

<td>${email.value}</td>

<td>${position.value}</td>

<td>${department.value}</td>

<td>

<button
class='btn'
onclick='editRow(this)'>

Edit

</button>

<button
class='btn'
onclick='deleteRow(this)'>

Delete

</button>

</td>

`;

table.appendChild(row);

updateTotal();

clearForm();

closeModal();

alert('Employee Saved');

}

/* DELETE */

function deleteRow(btn){

btn.closest('tr').remove();

updateTotal();

}

/* EDIT */

function editRow(btn){

openModal();

}

/* SEARCH */

function searchEmp(){

let val =
search.value.toLowerCase();

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

let visible = 0;

rows.forEach(row=>{

let show =
row.innerText
.toLowerCase()
.includes(val);

row.style.display =
show ? '' : 'none';

if(show) visible++;

});

total.innerText =
'Showing : ' + visible;

}

/* CLEAR */

function clearForm(){

document
.querySelectorAll('input,select')

.forEach(el=>{

if(el.type!='button'){

el.value='';

}

});

}

/* TOTAL */

function updateTotal(){

let rows =
document.querySelectorAll(
'#empTable tbody tr'
);

total.innerText =
'Total : ' + rows.length;

}

</script>

</body>
</html>
