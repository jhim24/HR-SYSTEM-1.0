<!DOCTYPE html>
<html>
<head>
<title>Employee Masterlist</title>

<style>

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  background:url('bg.jpg') no-repeat center center fixed;
  background-size:cover;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  z-index:-1;
}

/* WRAPPER */

.wrapper{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:240px;
  background:rgba(0,0,0,0.6);
  padding:20px;
}

.sidebar h3{
  margin-bottom:20px;
}

.menu{
  list-style:none;
  padding:0;
}

.menu li{
  padding:10px;
  margin-bottom:8px;
  border-radius:6px;
  cursor:pointer;
}

.menu li:hover{
  background:rgba(255,255,255,0.2);
}

/* MAIN */

.main{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

/* FORM */

.form-box{
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
}

/* INPUT */

input,select{
  padding:8px;
  border-radius:6px;
  border:none;
  font-size:12px;
  background:rgba(128,0,32,0.7);
  color:white;
}

input::placeholder{
  color:#ffd6e0;
}

input:focus,
select:focus{
  outline:none;
  background:rgba(128,0,32,0.9);
}

/* BUTTONS */

.add-btn{
  margin-top:10px;
  padding:10px;
  background:#2ecc71;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.btn{
  padding:5px 10px;
  border:none;
  border-radius:4px;
  cursor:pointer;
  color:white;
}

.edit{
  background:#3498db;
}

.delete{
  background:#e74c3c;
}

/* TABLE */

.table-box{
  background:#eaf4ff;
  padding:10px;
  border-radius:12px;
  overflow-x:auto;
  width:100%;
}

table{
  width:100%;
  min-width:1700px;
  border-collapse:collapse;
  font-size:12px;
  color:#2c3e50;
}

th,td{
  padding:6px;
  border:1px solid rgba(0,150,255,0.3);
  text-align:left;
  white-space:nowrap;
}

th{
  background:#cfe4ff;
  position:sticky;
  top:0;
  z-index:2;
}

/* SEARCH */

.search-box{
  margin-bottom:10px;
}

/* LOGOUT */

.logout{
  margin-top:20px;
  background:#e74c3c;
  padding:10px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
}

</style>

<script>

if(localStorage.getItem("loggedIn") !== "true"){

  window.location.href = "login.html";

}

</script>

</head>

<body>

<div class="wrapper">

<!-- SIDEBAR -->

<div class="sidebar">

<h3>HR System</h3>

<ul class="menu">

<li onclick="goPage('index.html')">
🏠 Dashboard
</li>

<li onclick="goPage('employee.html')">
👨‍💼 Employees
</li>

<li onclick="goPage('attendance.html')">
🕒 Attendance
</li>

<li onclick="goPage('payroll.html')">
💰 Payroll
</li>

<li onclick="goPage('payslip.html')">
🧾 Payslips
</li>

<li onclick="goPage('payroll-history.html')">
📄 History
</li>

</ul>

<div class="logout" onclick="logout()">

Logout

</div>

</div>

<!-- MAIN -->

<div class="main">

<h2>Employee Masterlist</h2>

<!-- FORM -->

<div class="form-box">

<div class="form-grid">

<input class="form-field"
id="fname"
placeholder="First Name">

<input class="form-field"
id="mname"
placeholder="Middle Name">

<input class="form-field"
id="lname"
placeholder="Last Name">

<input class="form-field"
type="date"
id="birthdate"
onchange="calcAge()">

<input class="form-field"
id="age"
placeholder="Age"
readonly>

<input class="form-field"
id="address"
placeholder="Address">

<select class="form-field"
id="bank">

<option>Bank Name</option>

<option>BPI</option>
<option>BDO</option>
<option>Metrobank</option>
<option>Landbank</option>

</select>

<input class="form-field"
id="bankAcc"
placeholder="Bank Account">

<input class="form-field"
id="empid"
placeholder="Employee ID">

<select class="form-field"
id="govId">

<option>Government ID</option>

<option>Passport</option>
<option>Driver License</option>
<option>National ID</option>

</select>

<input class="form-field"
id="sss"
placeholder="SSS">

<input class="form-field"
id="philhealth"
placeholder="PhilHealth">

<input class="form-field"
id="pagibig"
placeholder="Pag-IBIG">

<input class="form-field"
id="healthcard"
placeholder="Health Card">

<input class="form-field"
type="date"
id="joiningDate">

<select class="form-field"
id="employmentType">

<option>Employment Type</option>

<option>Regular</option>
<option>Probationary</option>
<option>Contractual</option>
<option>Part-Time</option>
<option>Seasonal</option>
<option>Intern</option>

</select>

<select class="form-field"
id="position">

<option>Position</option>

<option>Admin</option>
<option>Cashier</option>
<option>Waiter</option>
<option>Waitress</option>
<option>Manager</option>
<option>Supervisor</option>

</select>

</div>

<button class="add-btn"
onclick="addEmployee()">

Save Employee

</button>

</div>

<!-- SEARCH -->

<div class="search-box">

<input type="text"
id="search"
placeholder="🔍 Search..."
onkeyup="searchEmp()">

<span id="total"></span>

</div>

<!-- TABLE -->

<div class="table-box">

<table id="empTable">

<thead>

<tr>

<th>First</th>
<th>Middle</th>
<th>Last</th>
<th>Birthdate</th>
<th>Age</th>
<th>Address</th>
<th>Bank</th>
<th>Account</th>
<th>Emp ID</th>
<th>Gov ID</th>
<th>SSS</th>
<th>PhilHealth</th>
<th>Pag-IBIG</th>
<th>Health Card</th>
<th>Joining Date</th>
<th>Employment Type</th>
<th>Position</th>
<th>Action</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

</div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyClEtSTjrvf52exf2Qtdzb2MMLLlSfwhVg",

authDomain: "pappritohr.firebaseapp.com",

projectId: "pappritohr",

storageBucket: "pappritohr.firebasestorage.app",

messagingSenderId: "559428820611",

appId: "1:559428820611:web:09344b59fe1b21a5e2c5b6",

measurementId: "G-1CEQ4P5XW8"

};

/* INIT */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* GLOBAL */

let editId = null;

/* ======================================
   AGE
====================================== */

window.calcAge = function(){

  let birth =
  new Date(birthdate.value);

  let today =
  new Date();

  let years =
  today.getFullYear() -
  birth.getFullYear();

  let m =
  today.getMonth() -
  birth.getMonth();

  if(
    m < 0 ||
    (m === 0 &&
    today.getDate() < birth.getDate())
  ){
    years--;
  }

  age.value = years;
}

/* ======================================
   SAVE / UPDATE
====================================== */

window.addEmployee = async function(){

  let emp = {

    fname:
    fname.value.toUpperCase(),

    mname:
    mname.value.toUpperCase(),

    lname:
    lname.value.toUpperCase(),

    birthdate: birthdate.value,

    age: age.value,

    address: address.value,

    bank: bank.value,

    account: bankAcc.value,

    empid: empid.value,

    govId: govId.value,

    sss: sss.value,

    philhealth: philhealth.value,

    pagibig: pagibig.value,

    healthcard: healthcard.value,

    joiningDate:
    joiningDate.value,

    employmentType:
    employmentType.value,

    position: position.value

  };

  /* UPDATE */

  if(editId){

    await updateDoc(
      doc(db,"employees",editId),
      emp
    );

    alert("Employee Updated");

    editId = null;
  }

  /* ADD */

  else{

    await addDoc(
      collection(db,"employees"),
      emp
    );

    alert("Employee Saved");
  }

  clearForm();

  loadEmployees();
}

/* ======================================
   LOAD EMPLOYEES
====================================== */

window.loadEmployees = async function(){

  let tbody =
  document.querySelector("#empTable tbody");

  tbody.innerHTML = "";

  const querySnapshot =
  await getDocs(
    collection(db,"employees")
  );

  let count = 0;

  querySnapshot.forEach((d)=>{

    count++;

    let e = d.data();

    tbody.innerHTML += `

    <tr>

      <td>${e.fname || ''}</td>

      <td>${e.mname || ''}</td>

      <td>${e.lname || ''}</td>

      <td>${e.birthdate || ''}</td>

      <td>${e.age || ''}</td>

      <td>${e.address || ''}</td>

      <td>${e.bank || ''}</td>

      <td>${e.account || ''}</td>

      <td>${e.empid || ''}</td>

      <td>${e.govId || ''}</td>

      <td>${e.sss || ''}</td>

      <td>${e.philhealth || ''}</td>

      <td>${e.pagibig || ''}</td>

      <td>${e.healthcard || ''}</td>

      <td>${e.joiningDate || ''}</td>

      <td>${e.employmentType || ''}</td>

      <td>${e.position || ''}</td>

      <td>

      <button class="btn edit"

      onclick='editEmployee(
      "${d.id}",
      ${JSON.stringify(e)}
      )'>

      Edit

      </button>

      <button class="btn delete"

      onclick="deleteEmployee('${d.id}')">

      Delete

      </button>

      </td>

    </tr>

    `;
  });

  total.innerHTML =
  "Total : " + count;
}

/* ======================================
   EDIT
====================================== */

window.editEmployee = function(id,e){

  editId = id;

  fname.value = e.fname || "";

  mname.value = e.mname || "";

  lname.value = e.lname || "";

  birthdate.value =
  e.birthdate || "";

  age.value = e.age || "";

  address.value =
  e.address || "";

  bank.value = e.bank || "";

  bankAcc.value =
  e.account || "";

  empid.value =
  e.empid || "";

  govId.value =
  e.govId || "";

  sss.value = e.sss || "";

  philhealth.value =
  e.philhealth || "";

  pagibig.value =
  e.pagibig || "";

  healthcard.value =
  e.healthcard || "";

  joiningDate.value =
  e.joiningDate || "";

  employmentType.value =
  e.employmentType || "";

  position.value =
  e.position || "";

  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}

/* ======================================
   DELETE
====================================== */

window.deleteEmployee = async function(id){

  let confirmDelete =
  confirm("Delete Employee?");

  if(!confirmDelete){
    return;
  }

  await deleteDoc(
    doc(db,"employees",id)
  );

  loadEmployees();
}

/* ======================================
   SEARCH
====================================== */

window.searchEmp = function(){

  let val =
  search.value.toLowerCase();

  let rows =
  document.querySelectorAll(
  "#empTable tbody tr"
  );

  let visible = 0;

  rows.forEach(row=>{

    let show =
    row.innerText
    .toLowerCase()
    .includes(val);

    row.style.display =
    show ? "" : "none";

    if(show){
      visible++;
    }

  });

  total.innerHTML =
  "Showing : " + visible;
}

/* ======================================
   CLEAR FORM
====================================== */

window.clearForm = function(){

  document
  .querySelectorAll(".form-field")

  .forEach(el=>{

    el.value = "";

  });
}

/* ======================================
   PAGE
====================================== */

window.goPage = function(p){

  window.location.href = p;
}

/* ======================================
   LOGOUT
====================================== */

window.logout = function(){

  localStorage.removeItem("loggedIn");

  window.location.href =
  "login.html";
}

/* ======================================
   START
====================================== */

loadEmployees();

</script>

</body>
</html>
